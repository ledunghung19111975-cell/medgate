[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medgate"
version = "0.1.0"
description = "MedGate offline medical AI evaluation and release gate demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
medgate = "medgate.cli:main"
medgate-api = "medgate.api:main"

[tool.setuptools.packages.find]
include = ["medgate*"]
