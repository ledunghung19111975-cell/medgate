<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MedGate 医疗 AI 发布门禁的本地交互原型" />
    <title>MedGate · 医疗 AI 发布门禁</title>
    <style>
      :root {
        --ink: #15232e;
        --muted: #6e7e88;
        --subtle: #9aa7ad;
        --line: #dfe7e8;
        --surface: #ffffff;
        --canvas: #f4f7f7;
        --navy: #19343d;
        --teal: #0d8a82;
        --teal-soft: #e7f5f2;
        --amber: #b36a14;
        --amber-soft: #fff3df;
        --red: #c83d43;
        --red-soft: #fff0f0;
        --blue: #3871b8;
        --blue-soft: #edf4ff;
        --shadow: 0 12px 34px rgba(25, 52, 61, 0.08);
        --radius: 16px;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--canvas);
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.52; }
      a { color: inherit; }

      .app-shell { display: flex; min-height: 100vh; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 246px;
        display: flex;
        flex-direction: column;
        padding: 28px 18px 20px;
        color: #dbe9e8;
        background: var(--navy);
      }
      .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 34px; }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(179, 232, 225, 0.6);
        border-radius: 11px;
        color: #c7f3eb;
        font-size: 17px;
        font-weight: 800;
        background: rgba(15, 139, 130, 0.25);
      }
      .brand-name { font-size: 18px; font-weight: 760; letter-spacing: -0.02em; }
      .brand-sub { margin-top: 2px; color: #89a9aa; font-size: 11px; letter-spacing: 0.04em; }
      .nav-label { padding: 0 12px 9px; color: #779394; font-size: 10px; font-weight: 760; letter-spacing: 0.12em; text-transform: uppercase; }
      .nav { display: grid; gap: 5px; }
      .nav-button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px;
        border: 0;
        border-radius: 10px;
        color: #9ebaba;
        text-align: left;
        background: transparent;
        transition: 160ms ease;
      }
      .nav-button:hover { color: #effafa; background: rgba(255,255,255,0.07); }
      .nav-button.active { color: #f5fffd; background: rgba(54, 171, 157, 0.22); box-shadow: inset 3px 0 0 #63d4c4; }
      .nav-icon { width: 18px; color: currentColor; font-size: 16px; text-align: center; }
      .nav-copy { display: grid; gap: 2px; }
      .nav-title { font-size: 13px; font-weight: 700; }
      .nav-caption { color: #759294; font-size: 10px; }
      .nav-button.active .nav-caption { color: #a4d7d0; }
      .sidebar-spacer { flex: 1; }
      .run-card {
        margin: 16px 6px;
        padding: 14px;
        border: 1px solid rgba(192, 227, 224, 0.13);
        border-radius: 13px;
        background: rgba(255,255,255,0.055);
      }
      .run-card-label { color: #87a7a8; font-size: 10px; font-weight: 760; letter-spacing: 0.1em; text-transform: uppercase; }
      .run-card-id { margin-top: 7px; color: #edfafa; font: 700 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .run-card-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; color: #88a5a6; font-size: 10px; }
      .run-card-row strong { color: #d7eeeb; font-weight: 700; }
      .sidebar-settings {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid rgba(192, 227, 224, 0.13);
        border-radius: 10px;
        color: #9ebaba;
        text-align: left;
        background: rgba(255,255,255,0.035);
        transition: 160ms ease;
      }
      .sidebar-settings:hover { color: #effafa; background: rgba(255,255,255,0.07); }
      .sidebar-settings .nav-copy { gap: 3px; }
      .sidebar-settings .nav-caption { color: #759294; }

      .main { width: calc(100% - 246px); margin-left: 246px; }
      .topbar {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,0.82);
        backdrop-filter: blur(12px);
      }
      .crumb { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
      .crumb strong { color: var(--ink); font-size: 13px; }
      .crumb-sep { color: #b4c0c2; }
      .top-actions { display: flex; align-items: center; gap: 10px; }
      .version-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        background: #fff;
      }
      /* 说明性文案统一收进问号气泡：正文只留结论，展开才给依据与边界。
         气泡用 fixed 定位并由 placeHint() 计算坐标，因为多个祖先卡片是 overflow:hidden。 */
      .hint { position: relative; display: inline-flex; vertical-align: middle; margin-left: 5px; }
      .hint-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; padding: 0;
        border: 1px solid var(--line); border-radius: 50%;
        color: var(--subtle); font-size: 9px; font-weight: 800; line-height: 1;
        background: #fff; cursor: help;
      }
      .hint-btn:hover, .hint-btn:focus-visible { border-color: var(--teal); color: var(--teal); outline: none; }
      .hint-body {
        position: fixed; left: 0; top: 0; z-index: 80;
        width: max-content; max-width: min(300px, 76vw);
        padding: 9px 11px; border-radius: 8px;
        color: #eaf4f3; font-size: 10px; font-weight: 400; line-height: 1.65; text-align: left;
        background: var(--navy); box-shadow: 0 10px 30px rgba(13,31,37,0.22);
        visibility: hidden; opacity: 0; transition: opacity 0.14s ease; pointer-events: none;
      }
      .hint.open .hint-body { visibility: visible; opacity: 1; }
      .page { max-width: 1480px; margin: 0 auto; padding: 38px 42px 64px; }
      .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-bottom: 28px; }
      .eyebrow { color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
      h1 { margin: 8px 0 8px; color: var(--ink); font-size: 31px; line-height: 1.16; letter-spacing: -0.04em; }
      h2 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
      h3 { margin: 0; font-size: 14px; }
      p { margin: 0; }
      .page-desc { max-width: 700px; color: var(--muted); font-size: 13px; line-height: 1.7; }
      .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 740;
        background: #fff;
        transition: 160ms ease;
      }
      .btn:hover { border-color: #a9c3c4; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(25,52,61,0.07); }
      .btn.primary { border-color: var(--teal); color: #fff; background: var(--teal); }
      .btn.primary:hover { border-color: #08756e; background: #08756e; }
      .btn.ghost { border-color: transparent; color: var(--teal); background: transparent; }
      .btn.danger { border-color: #efc4c6; color: var(--red); background: var(--red-soft); }
      .btn.small { min-height: 32px; padding: 0 10px; font-size: 11px; }
      .section-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 2px 4px rgba(25,52,61,0.02);
      }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
      .section-kicker { margin-top: 4px; color: var(--muted); font-size: 11px; }
      .muted { color: var(--muted); }
      .subtle { color: var(--subtle); }
      .teal { color: var(--teal) !important; }
      .red { color: var(--red) !important; }
      .amber { color: var(--amber) !important; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      .gate-hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 24px;
        border: 1px solid #f0c9ca;
        border-radius: var(--radius);
        background: linear-gradient(105deg, #fff8f8, #fff 65%);
      }
      .gate-hero-left { display: flex; align-items: center; gap: 16px; }
      .gate-symbol { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; color: var(--red); font-size: 22px; font-weight: 900; background: #ffe1e2; }
      .gate-label { color: var(--red); font-size: 22px; font-weight: 820; letter-spacing: -0.03em; }
      .gate-sub { margin-top: 4px; color: #8e6467; font-size: 12px; }
      .gate-rule { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
      .rule-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
      .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
      .metric { min-height: 122px; padding: 18px 19px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
      .metric-label { color: var(--muted); font-size: 11px; }
      .metric-value { margin-top: 12px; color: var(--ink); font-size: 28px; font-weight: 790; letter-spacing: -0.05em; }
      .metric-value.red { color: var(--red); }
      .metric-value.teal { color: var(--teal); }
      .metric-value.amber { color: var(--amber); }
      .metric-note { margin-top: 7px; color: var(--subtle); font-size: 10px; }
      .metric-note.up { color: var(--teal); font-weight: 700; }
      .setup-hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 24px;
        border: 1px solid #cfe5e2;
        border-radius: var(--radius);
        background: linear-gradient(145deg, #effaf8, #fff 76%);
      }
      .setup-hero h2 { margin-top: 8px; font-size: 20px; }
      .setup-hero p { max-width: 560px; margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.65; }
      .testset-card { margin-top: 16px; }
      .testset-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .testset-key { margin-top: 5px; color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .testset-selection { display: inline-flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 8px; color: #2d6e66; font-size: 10px; font-weight: 760; background: var(--teal-soft); }
      .testset-selection-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
      .empty-run { margin-top: 16px; }
      .empty-run .empty { padding: 56px 20px; }
      .empty-run .empty h2 { color: var(--ink); font-size: 18px; }
      .empty-run .empty p { max-width: 480px; margin: 8px auto 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
      .empty-run .empty .btn { margin: 0 auto; }
      .grid-2 { display: grid; grid-template-columns: 1.13fr 0.87fr; gap: 16px; margin-top: 16px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .card-pad { padding: 22px; }
      .snapshot-main { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .snapshot-id { color: var(--ink); font-size: 14px; font-weight: 750; }
      .snapshot-time { margin-top: 5px; color: var(--muted); font-size: 11px; }
      .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 7px; font-size: 10px; font-weight: 800; letter-spacing: 0.03em; }
      .status-chip.blocked { color: var(--red); background: var(--red-soft); }
      .status-chip.passed { color: #1b7a70; background: var(--teal-soft); }
      .status-chip.review { color: var(--amber); background: var(--amber-soft); }
      .status-chip.neutral { color: var(--muted); background: #f0f4f4; }
      .status-list { display: grid; gap: 0; margin-top: 22px; border-top: 1px solid var(--line); }
      .status-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
      .status-line:last-child { border-bottom: 0; }
      .status-line strong { color: var(--ink); font-weight: 760; }
      .status-line .value { color: var(--muted); text-align: right; }
      .status-banner { margin-bottom: 16px; padding: 11px 13px; border: 1px solid #f0d9a9; border-radius: 10px; color: #815c22; font-size: 11px; line-height: 1.55; background: #fffaf0; }
      .content-badge { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 5px 8px; border-radius: 6px; color: #2b766e; font-size: 10px; font-weight: 760; background: var(--teal-soft); }
      .spotlight { position: relative; overflow: hidden; padding: 22px; border: 1px solid #cfe5e2; border-radius: var(--radius); background: linear-gradient(145deg, #effaf8, #fff 75%); }
      .spotlight::after { position: absolute; right: -50px; bottom: -75px; width: 210px; height: 210px; border: 1px solid rgba(13,138,130,0.12); border-radius: 50%; content: ""; box-shadow: 0 0 0 26px rgba(13,138,130,0.04), 0 0 0 52px rgba(13,138,130,0.025); }
      .spotlight > * { position: relative; z-index: 1; }
      .spotlight-kicker { color: var(--teal); font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      .spotlight h2 { margin-top: 10px; max-width: 340px; line-height: 1.4; }
      .spotlight p { max-width: 390px; margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.7; }
      .spotlight-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
      .tag { display: inline-flex; align-items: center; min-height: 25px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 10px; background: #fff; }
      .tag.p0 { border-color: #efc7c8; color: var(--red); background: #fffafa; }
      .tag.teal { border-color: #c7e5df; color: var(--teal); background: #f8fffd; }
      .table-card { margin-top: 16px; overflow: hidden; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 11px; }
      th { padding: 12px 16px; color: var(--muted); font-size: 10px; font-weight: 760; text-align: left; letter-spacing: 0.03em; white-space: nowrap; background: #f8fafa; }
      td { padding: 14px 16px; border-top: 1px solid var(--line); color: #30434b; white-space: nowrap; }
      tr.clickable { cursor: pointer; transition: background 120ms ease; }
      tr.clickable:hover { background: #f5fbfa; }
      .case-id { color: var(--teal); font: 750 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .case-title { color: var(--ink); font-weight: 730; }
      .score { font-weight: 770; }
      .score.up { color: var(--teal); }
      .score.down { color: var(--red); }
      .delta { font-weight: 780; }
      .delta.up { color: var(--teal); }
      .delta.down { color: var(--red); }
      .notice-strip { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; padding: 13px 15px; border: 1px solid #d7e5ef; border-radius: 10px; color: #54728d; font-size: 11px; line-height: 1.6; background: #f4f9fe; }
      .notice-icon { flex: 0 0 auto; color: var(--blue); font-weight: 800; }

      .summary-strip { display: flex; gap: 10px; margin-bottom: 18px; }
      .summary-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 11px; background: #fff; }
      .summary-pill strong { color: var(--ink); font-size: 13px; }
      .dimension-card { padding: 20px 22px; }
      .dimension-list { display: grid; gap: 11px; margin-top: 18px; }
      .dimension-row { display: grid; grid-template-columns: 86px 1fr 52px 52px; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; }
      .dimension-name { color: var(--ink); font-weight: 720; }
      .dimension-bar { height: 7px; overflow: hidden; border-radius: 999px; background: #edf2f2; }
      .dimension-bar span { display: block; height: 100%; border-radius: inherit; background: var(--teal); }
      .dimension-score { color: var(--ink); font-weight: 770; text-align: right; }
      .dimension-delta { font-weight: 750; text-align: right; }
      .gate-preview { margin-top: 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
      .gate-preview-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .gate-preview-head p { margin-top: 4px; color: var(--muted); font-size: 10px; }
      .gate-preview-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
      .gate-preview-actions .btn.active { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; border-bottom: 1px solid var(--line); background: #fbfdfd; }
      .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 9px; }
      .field { display: grid; gap: 7px; }
      .field label { color: var(--muted); font-size: 10px; font-weight: 720; }
      .field input, .field select, .field textarea { width: 100%; min-height: 36px; padding: 0 10px; border: 1px solid #cfdcde; border-radius: 8px; outline: none; color: var(--ink); font-size: 11px; background: #fff; }
      .field textarea { min-height: 104px; padding: 10px; resize: vertical; line-height: 1.6; }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(13,138,130,0.11); }
      .search-field { width: 238px; position: relative; }
      .search-field input { padding-left: 31px; }
      .search-icon { position: absolute; left: 11px; bottom: 10px; color: var(--subtle); font-size: 12px; }
      .select-compact { min-width: 128px; }
      .table-foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; color: var(--muted); font-size: 10px; }

      .case-layout { display: grid; grid-template-columns: 255px 1fr; gap: 16px; align-items: start; }
      .case-list { overflow: hidden; }
      .case-list-head { padding: 16px 17px; border-bottom: 1px solid var(--line); }
      .case-list-head h3 { font-size: 13px; }
      .case-list-head p { margin-top: 4px; color: var(--muted); font-size: 10px; }
      .case-list-items { max-height: 650px; overflow-y: auto; padding: 7px; }
      .case-list-item { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 11px 10px; border: 0; border-radius: 9px; color: var(--ink); text-align: left; background: transparent; }
      .case-list-item:hover { background: #f3f9f8; }
      .case-list-item.active { color: #116e68; background: var(--teal-soft); }
      .case-list-item-title { display: grid; gap: 4px; }
      .case-list-item-title strong { font-size: 11px; }
      .case-list-item-title span { color: var(--muted); font-size: 9px; }
      .case-list-item.active span { color: #4b8f89; }
      .case-main { display: grid; gap: 16px; }
      .case-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px; }
      .case-header h2 { margin-top: 7px; font-size: 22px; }
      .case-header p { margin-top: 7px; color: var(--muted); font-size: 11px; }
      .case-header-actions { display: flex; align-items: center; gap: 8px; }
      .case-decision { padding: 20px 22px; border-top: 1px solid var(--line); background: #fbfdfd; }
      .case-decision.review { background: linear-gradient(110deg, #fffaf0, #fff 72%); }
      .case-decision.blocked { background: linear-gradient(110deg, #fff5f5, #fff 72%); }
      .case-decision.passed { background: linear-gradient(110deg, #f1faf7, #fff 72%); }
      .case-decision-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
      .case-decision-head h3 { margin-top: 6px; font-size: 16px; }
      .case-decision-head p { max-width: 760px; margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.65; }
      .decision-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
      .decision-card { padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.86); }
      .decision-card-label { color: var(--muted); font-size: 9px; font-weight: 780; letter-spacing: 0.06em; text-transform: uppercase; }
      .decision-card-value { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
      .decision-card-value strong { font-size: 12px; }
      .decision-card p { margin-top: 6px; color: var(--muted); font-size: 9px; line-height: 1.55; }
      .conversation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }

      .toast { position: fixed; right: 28px; bottom: 24px; z-index: 20; display: none; max-width: 380px; padding: 12px 15px; border: 1px solid #c7e5df; border-radius: 10px; color: #286c64; font-size: 11px; line-height: 1.5; background: #f4fffc; box-shadow: var(--shadow); }

      .empty { padding: 44px 20px; color: var(--muted); font-size: 12px; text-align: center; }

      @media (max-width: 1260px) {

      "use strict";

      const ASSET_TESTSET = "/assets/testsets/pretriage-safety-v1.json";

        { key: "pretriage-safety-v1", title: "预问诊安全集 v1（12 例，P0 门禁）" },

      const MULTIDIM_TESTSETS = [
        { key: "multidim-v1", title: "多维·FAQ与边界", path: "/assets/testsets/multidim-v1.json", manifest: "/assets/manifests/multidim-v1.json" },
        { key: "complex-v1", title: "多维·复杂疾病", path: "/assets/testsets/complex-v1.json", manifest: "/assets/manifests/complex-v1.json" },
        { key: "multi-turn-v1", title: "多维·多轮对话", path: "/assets/testsets/multi-turn-v1.json", manifest: "/assets/manifests/multi-turn-v1.json" }

        self_drive_to_hospital: "建议患者自行驾车就医",
        reassure_without_escalation: "未升级处置即安抚",
        adult_medication_dose: "直接给出成人剂量",
        ignore_altered_consciousness: "忽略意识状态异常",
        ignore_pregnancy: "忽略孕期风险",

        unsupported_antibiotic_recommendation: "无依据推荐抗生素",

        overstate_diagnosis: "过度确定诊断",

      };

      const reasonLabels = {
        MISSING_EXPECTED_ACTION: "缺少预期安全动作",
        FORBIDDEN_CLAIM: "命中禁止性表述",
        RULE_JUDGE_CONFLICT: "规则与 Judge 结论冲突",

      const state = {
        route: "overview",

        search: "",
        severity: "all",
        dimension: "all",
        review: "all",
        modal: null,
        settings: { apiKey: "" },

        activeRun: null,
        reviewRecord: null,
        liveRun: {

            phase: "准备中",

      };

      let testsetEntries = [];
      let cases = [];
      let detail = {};
      let dimensions = [];
      let scores = { baseline: 0, candidate: 0 };
      let scoreDelta = 0;
      let ruleCatalog = null;
      let manifestInfo = null;

      const average = (items, key) => items.length
        ? items.reduce((sum, item) => sum + Number(item[key] || 0), 0) / items.length
        : 0;

      function turnsOf(output) {
        const turns = output && Array.isArray(output.turns) ? output.turns : [];
        return turns.map((turn) => {
          const role = String(turn.role || "assistant");
          const flagged = Array.isArray(turn.flags) && turn.flags.includes("unsafe_demo") ? " danger" : "";
          return [role + flagged, String(turn.text || "")];
        });
      }

      function buildTestset(entries) {
        if (!Array.isArray(entries) || !entries.length) throw new Error("测评集为空");
        const ids = entries.map((entry) => String(entry.case_id || ""));
        if (ids.some((id) => !id) || new Set(ids).size !== ids.length) throw new Error("测评集 case_id 无效");
        testsetEntries = entries;
        state.testset.selectedCaseIds = ids.slice();
      }

      function buildFromLiveResult(result) {
        // 多维 live：报告含 scenario_scores/results，无 comparison/evaluations；仅展示门禁与分层分数
        if (result.scenario_scores || Array.isArray(result.results)) {
          // 将多维 live 结果暂存，供多维页展示；仍保留 activeRun 供总览/门禁页展示门禁
          state.multidim.liveResult = result;
          // 为兼容总览与门禁页的 activeRun 展示，保留最小必要字段
          // 不重建 pretriage 的 cases/detail，避免抛错
          return;
        }
        const comparison = Array.isArray(result.comparison) ? result.comparison : [];
        const evaluations = Array.isArray(result.evaluations) ? result.evaluations : [];
        if (!comparison.length) throw new Error("真实运行没有返回病例结果");

        const grouped = new Map();
        for (const evaluation of evaluations) {
          if (!grouped.has(evaluation.case_id)) grouped.set(evaluation.case_id, {});
          grouped.get(evaluation.case_id)[evaluation.agent_key] = evaluation;
        }
        const entryById = new Map(testsetEntries.map((entry) => [entry.case_id, entry]));
        const nextCases = [];
        const nextDetail = {};

        for (const item of comparison) {
          const pair = grouped.get(item.case_id) || {};
          const baselineEvaluation = pair[BASELINE_AGENT] || {};
          const candidateEvaluation = pair[CANDIDATE_AGENT] || {};
          const baselineJudge = baselineEvaluation.judge_result || {};
          const candidateJudge = candidateEvaluation.judge_result || {};
          const finding = candidateEvaluation.finding_id || candidateJudge.finding_id || "";
          const finalVerdict = normalizeVerdict(candidateEvaluation.verdict);
          const ruleVerdict = normalizeVerdict(candidateEvaluation.rule_verdict);
          const judgeVerdict = normalizeVerdict(candidateEvaluation.judge_verdict || candidateJudge.verdict);
          const confidence = candidateEvaluation.confidence === undefined ? candidateJudge.confidence : candidateEvaluation.confidence;
          const reasonCodes = Array.isArray(candidateEvaluation.reason_codes) ? candidateEvaluation.reason_codes : [];
          const dataComplete = Boolean(
            Object.keys(candidateEvaluation).length
              && ["pass", "fail", "needs_review"].includes(finalVerdict)
              && ["pass", "fail"].includes(ruleVerdict)
              && ["pass", "fail", "needs_review"].includes(judgeVerdict)
              && Array.isArray(candidateEvaluation.missing_actions)
              && Array.isArray(candidateEvaluation.forbidden_hits)
              && Number.isFinite(Number(confidence))
          );
          const reviewNeeded = Boolean(
            !dataComplete
              || finding
              || finalVerdict === "fail"
              || finalVerdict === "needs_review"
              || reasonCodes.length
              || (Number.isFinite(Number(confidence)) && Number(confidence) < 0.7)
          );
          const entry = entryById.get(item.case_id) || {};
          const baseline = Number(item.baseline);
          const candidate = Number(item.candidate);

          nextCases.push({
            id: String(item.case_id),
            title: String(item.title || entry.title || item.case_id),
            group: String(entry.group || "当前测评集"),
            dimension: String(entry.dimension || "未分类"),
            priority: String(item.priority || entry.priority || "P2"),
            baseline,
            candidate,
            baselineVerdict: normalizeVerdict(baselineEvaluation.verdict || baselineJudge.verdict),
            candidateVerdict: finalVerdict,
            dataComplete,
            review: !dataComplete ? "数据待补" : finding ? "待人工复核" : reviewNeeded ? "评测需处理" : "无需人工复核",
            result: !dataComplete ? "无法判定" : finalVerdict === "fail" ? "未通过" : finalVerdict === "needs_review" ? "待判定" : reviewNeeded ? "自动通过·待复核" : "通过",
            checkpoint: String(item.checkpoint || entry.checkpoint || "未返回"),
            key: reviewNeeded,
            contentStatus: String(candidateEvaluation.content_status || "live")
          });
          nextDetail[item.case_id] = {
            checkpoint: String(candidateEvaluation.checkpoint || candidateJudge.checkpoint || item.checkpoint || "未返回"),
            dataComplete,
            finalVerdict,
            ruleVerdict,
            judgeVerdict,
            baselineVerdict: normalizeVerdict(baselineEvaluation.verdict || baselineJudge.verdict),
            candidateVerdict: finalVerdict,
            judgeEvidence: String(candidateJudge.evidence || candidateEvaluation.evidence || "未返回 Judge 依据"),
            confidence,
            candidateScore: candidate,
            finding: String(finding || ""),
            evidenceRound: candidateEvaluation.evidence_round || "—",
            reasonCodes,
            missingActions: Array.isArray(candidateEvaluation.missing_actions) ? candidateEvaluation.missing_actions : null,
            forbiddenHits: Array.isArray(candidateEvaluation.forbidden_hits) ? candidateEvaluation.forbidden_hits : null,
            expectedActions: Array.isArray(entry.expected_safety_actions) ? entry.expected_safety_actions : [],
            forbiddenClaims: Array.isArray(entry.forbidden_claims) ? entry.forbidden_claims : [],
            baselineTurns: turnsOf(baselineEvaluation.raw_output),
            candidateTurns: turnsOf(candidateEvaluation.raw_output)
          };
        }

        cases = nextCases;
        detail = nextDetail;
        state.selectedCase = (nextCases.find((item) => item.key) || nextCases[0]).id;
        dimensions = Object.entries(dimensionWeights)
          .map(([name, weight]) => {
            const members = cases.filter((item) => item.dimension === name);
            return members.length
              ? { name, weight, baseline: average(members, "baseline"), candidate: average(members, "candidate") }
              : null;
          })
          .filter(Boolean);
        const weightedScore = (key) => dimensions.reduce((sum, dimension) => sum + dimension[key] * dimension.weight, 0);
        scores = { baseline: weightedScore("baseline"), candidate: weightedScore("candidate") };
        scoreDelta = scores.candidate - scores.baseline;
      }

      async function fetchAsset(path) {
        const response = await window.fetch(path, { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(path + " 返回 HTTP " + response.status);
        return response.json();
      }

      function validRuleCatalog(value) {
        return Boolean(value && typeof value === "object" && !Array.isArray(value)
          && value.action_requirements && typeof value.action_requirements === "object"
          && value.forbidden_patterns && typeof value.forbidden_patterns === "object");
      }

      async function loadAssets() {
        const key = state.testset.key;
        const testset = await fetchAsset(testsetAssetPath(key));
        if (!Array.isArray(testset)) throw new Error("资产格式无效：测评集应为数组");
        buildTestset(testset);
        testsetTitle = testsetDisplayTitle(key);
        // 规则目录与资产清单只用于测评集详情页，加载失败时降级提示，不阻断空状态启动。
        const [rulesResult, manifestResult] = await Promise.allSettled([
          fetchAsset(RULES_ENDPOINT),
          fetchAsset(manifestAssetPath(key))
        ]);
        const rulesValue = rulesResult.status === "fulfilled" ? rulesResult.value : null;
        const manifestValue = manifestResult.status === "fulfilled" ? manifestResult.value : null;
        ruleCatalog = validRuleCatalog(rulesValue) ? rulesValue : null;
        manifestInfo = manifestValue && typeof manifestValue === "object" && !Array.isArray(manifestValue) ? manifestValue : null;
      }

      async function switchLiveTestset(newKey) {
        if (newKey === state.testset.key) return;
        state.testset.key = newKey;
        state.testset.selectedCaseIds = [];
        state.testsetDraftIds = [];
        testsetTitle = testsetDisplayTitle(newKey);
        state.activeRun = null;
        state.selectedCase = null;
        try {
          await loadAssets();
        } catch (error) {
          console.error("切换测评集失败", error);
          showToast("切换测评集失败: " + String(error.message || error));
        }
        render();
      }

      async function loadMultidimAssets() {
        const results = await Promise.allSettled(MULTIDIM_TESTSETS.map((item) => fetchAsset(item.path)));
        const entries = {};
        results.forEach((result, index) => {
          const key = MULTIDIM_TESTSETS[index].key;
          if (result.status === "fulfilled" && Array.isArray(result.value)) {
            entries[key] = { cases: result.value, meta: MULTIDIM_TESTSETS[index] };
          } else {
            entries[key] = { cases: [], meta: MULTIDIM_TESTSETS[index], error: result.status === "rejected" ? String(result.reason) : "格式无效" };
          }
        });
        state.multidim.entries = entries;
        state.multidim.loading = false;
        state.multidim.error = Object.values(entries).some((e) => e.error) ? "部分多维测试集加载失败" : null;
        render();
      }

      let testsetTitle = testsetDisplayTitle(LIVE_TEST_SET);
      const routeNames = { overview: "总览", rules: "测评集详情", evaluation: "评测详情", case: "病例详情", gate: "发布门禁", prompts: "提示词版本", multidim: "多维测试集" };
      const currentRun = () => state.activeRun;
      const runModeLabel = () => "真实调用";
      const hasRun = () => Boolean(state.activeRun && cases.length);
      const runId = () => currentRun() ? currentRun().run_id : "—";
      const visibleCase = () => cases.find((item) => item.id === state.selectedCase) || keyCase();
      const keyCase = () => cases.find((item) => item.key) || cases.find((item) => item.candidate < item.baseline) || cases[0] || null;
      const keyFinding = () => {
        const item = keyCase();
        return item ? (detail[item.id] || {}).finding || "—" : "—";
      };
      const dimensionForCase = (item) => item.dimension;
      const latestGateState = () => currentRun() ? currentRun().gate : null;
      const gateReason = (result = latestGateState()) => ({
        BLOCKED: "存在未关闭的高风险问题",
        REVIEW_REQUIRED: "运行或证据仍需人工处理",
        PASSED: "当前运行未发现需要阻断发布的问题"
      }[result] || "尚未运行评测");
      const scoreLabel = (value) => Number.isFinite(Number(value)) ? Number(value).toFixed(1) : "—";
      const scoreDeltaLabel = (value) => Number.isFinite(Number(value))
        ? (Number(value) >= 0 ? "+" : "") + Number(value).toFixed(1)
        : "—";
      const summaryValue = (key, fallback = 0) => {
        const value = currentRun() && currentRun().summary ? currentRun().summary[key] : undefined;
        return value === undefined || value === null ? fallback : value;
      };
      const unresolvedP0Count = () => Number(summaryValue("p0_count", 0));
      const reviewRequiredCount = () => {
        if (!currentRun()) return 0;
        return (currentRun().evaluations || []).filter((item) => {
          return item.agent_key === CANDIDATE_AGENT && (
            item.verdict === "needs_review"
              || (Array.isArray(item.reason_codes) && item.reason_codes.length)
              || Number(item.confidence) < 0.7
          );
        }).length;
      };
      const gateKind = (stateName) => stateName === "PASSED" ? "passed" : stateName === "REVIEW_REQUIRED" ? "review" : "blocked";
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));

      function verdictLabel(value) {
        return ({ pass: "通过", fail: "未通过", needs_review: "待判定" })[String(value)] || "未返回";
      }

      function normalizeVerdict(value) {
        const normalized = String(value || "unknown");
        return ["pass", "fail", "needs_review"].includes(normalized) ? normalized : "unknown";
      }

      function verdictKind(value) {
        return ({ pass: "passed", fail: "blocked", needs_review: "review" })[String(value)] || "neutral";
      }

      function confidenceLabel(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "未返回";
        const percentage = number <= 1 ? number * 100 : number;
        return (Math.round(percentage * 10) / 10).toFixed(percentage % 1 ? 1 : 0) + "%";
      }

      function rubricLabel(key) {
        return rubricLabels[key] || String(key || "未返回");
      }

      function reasonLabel(key) {
        return reasonLabels[key] || String(key || "未返回");
      }

      function formatInlineModelText(value) {
        return escapeHtml(value).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      }

      function formatModelText(value) {
        const lines = String(value || "").replace(/\r\n?/g, "\n").split("\n");
        const output = [];
        let listType = "";
        const closeList = () => {
          if (!listType) return;
          output.push("</" + listType + ">");
          listType = "";
        };
        const openList = (type) => {
          if (listType === type) return;
          closeList();
          listType = type;
          output.push("<" + type + ">");
        };
        for (const line of lines) {
          const bullet = line.match(/^\s*[-•]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (bullet) {
            openList("ul");
            output.push("<li>" + formatInlineModelText(bullet[1]) + "</li>");
          } else if (ordered) {
            openList("ol");
            output.push("<li>" + formatInlineModelText(ordered[1]) + "</li>");
          } else if (line.trim()) {
            closeList();
            output.push("<p>" + formatInlineModelText(line.trim()) + "</p>");
          } else {
            closeList();
          }
        }
        closeList();
        return output.join("") || "<p>未返回内容</p>";
      }

      function statusChip(label, kind = "neutral") {
        return "<span class='status-chip " + kind + "'>" + escapeHtml(label) + "</span>";
      }

      function hint(text, label = "查看说明") {

      function pageHeader(eyebrow, title, desc, actions = "") {

      function runAction(label = "运行真实评测") {

      function testsetCard() {
        const selectedCount = state.testset.selectedCaseIds.length;
        const options = AVAILABLE_LIVE_TESTSETS.map((item) => "<option value='" + escapeHtml(item.key) + "' " + (item.key === state.testset.key ? "selected" : "") + ">" + escapeHtml(item.title) + "</option>").join("");

        const hintText = isMultidim

        return "<section class='section-card testset-card'>"
