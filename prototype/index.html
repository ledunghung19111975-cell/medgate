          + "<div class='field' style='margin-top:12px'><label for='live-testset-select' style='font-size:11px;color:var(--muted)'>切换测评集（支持多维 150 例）</label><select id='live-testset-select' data-action='switch-testset' class='select-compact' style='width:100%;margin-top:4px'>" + options + "</select></div>"
          + "<div class='status-list' style='margin-top:12px'><div class='status-line'><span>病例总数</span><strong>" + testsetEntries.length + " 例</strong></div><div class='status-line'><span>本次选择</span><span class='value'>" + selectedCount + " 例</span></div><div class='status-line'><span>配置状态</span><span class='value'>当前页面已加载</span></div></div></div></section>";
      }

      function emptyRunCard(copy = "先选择测评集，再运行 Baseline 与 Candidate 两版提示词。") {
        return "<section class='section-card empty-run'><div class='empty'><h2>还没有评测结果</h2><p>" + copy + "</p>" + runAction() + "</div></section>";
      }

      function emptyPage(eyebrow, title, desc) {
        return "<div class='page'>" + pageHeader(eyebrow, title, desc, "<button class='btn' data-route='overview'>← 返回总览</button>")
          + testsetCard() + emptyRunCard() + "</div>";
      }

      function overviewView() {
        if (!hasRun()) {
          return "<div class='page'>"
            + pageHeader("本地评测工作台", "先配置，再运行", "当前页面没有评测结果。选择测评集并运行一次真实评测，结果会出现在这里。", runAction())
            + "<section class='setup-hero'><div><div class='eyebrow'>READY WHEN YOU ARE</div><h2>从一次真实运行开始</h2><p>Key 只在本页面内存中使用；测评结果、Gate 和证据均来自本次服务端运行。</p></div>" + runAction("开始真实评测") + "</section>"
            + testsetCard() + "</div>";
        }

        const run = currentRun();
        const currentState = latestGateState();
        const issue = keyCase();
        const issueDetail = issue ? detail[issue.id] || {} : {};
        const blocked = currentState === "BLOCKED";
        const reviewRequired = currentState === "REVIEW_REQUIRED";
        const highlight = issue
          ? "<section class='spotlight'><div class='spotlight-kicker'>需要关注</div><h2>" + escapeHtml(issue.title) + "</h2><p>" + escapeHtml(issueDetail.judgeEvidence || issueDetail.evidence || "本次运行返回了待处理证据。") + "</p><div class='spotlight-meta'><span class='tag'>" + escapeHtml(issue.id) + "</span><span class='tag'>" + escapeHtml(issue.checkpoint) + "</span><span class='tag " + (issue.candidate < issue.baseline ? "p0" : "teal") + "'>" + escapeHtml(issue.review) + "</span></div><div style='margin-top:20px'><button class='btn primary' data-action='view-case' data-case-key='" + escapeHtml(issue.id) + "'>查看证据 →</button></div></section>"
          : "<section class='spotlight'><div class='spotlight-kicker'>当前运行</div><h2>没有待处理 Finding</h2><p>本次运行未返回需要单独关注的病例。</p></section>";

        return "<div class='page'>"
          + pageHeader("" + escapeHtml(runModeLabel(run)) + " · " + escapeHtml(run.run_id), "评测结果", "以下内容均来自本次真实运行。" + hint("页面不会预置历史结果；刷新后需要重新运行或从服务端加载新的结果。"), runAction("重新运行"))
          + "<section class='gate-hero'><div class='gate-hero-left'><div class='gate-symbol'>" + (blocked ? "!" : reviewRequired ? "?" : "✓") + "</div><div><div class='gate-label'>" + currentState + "</div><div class='gate-sub'>" + escapeHtml(gateReason(currentState)) + " · " + escapeHtml(run.run_id) + "</div></div></div><div class='gate-rule'><span class='rule-dot'></span><span>当前 Gate 结论</span></div></section>"
          + "<div class='metrics'><div class='metric'><div class='metric-label'>Candidate 平均分</div><div class='metric-value teal'>" + scoreLabel(scores.candidate) + "</div><div class='metric-note up'>" + scoreDeltaLabel(scoreDelta) + " vs Baseline " + scoreLabel(scores.baseline) + "</div></div>"
          + "<div class='metric'><div class='metric-label'>未解决 P0</div><div class='metric-value red'>" + unresolvedP0Count() + "</div><div class='metric-note'>" + (unresolvedP0Count() ? "需要阻断发布" : "当前运行未发现") + "</div></div>"
          + "<div class='metric'><div class='metric-label'>待处理证据</div><div class='metric-value amber'>" + reviewRequiredCount() + "</div><div class='metric-note'>" + (reviewRequiredCount() ? "需要人工确认" : "当前运行未发现") + "</div></div>"
          + "<div class='metric'><div class='metric-label'>外部模型调用</div><div class='metric-value'>" + summaryValue("external_call_count", "—") + "</div><div class='metric-note'>本次运行返回</div></div></div>"
          + "<div class='grid-2'><section class='section-card'><div class='section-head'><div><h2>本次运行</h2><div class='section-kicker'>当前服务端返回的运行摘要</div></div>" + statusChip(run.status, "passed") + "</div><div class='card-pad'><div class='snapshot-main'><div><div class='snapshot-id mono'>" + escapeHtml(run.run_id) + "</div><div class='snapshot-time'>" + escapeHtml((run.report && run.report.generated_at) || "当前会话") + " · " + summaryValue("case_count", cases.length) + " 例 × 2 版本</div></div><button class='btn small' data-route='gate'>查看门禁</button></div><div class='status-list'><div class='status-line'><span>运行状态</span><strong>" + escapeHtml(run.status) + "</strong></div><div class='status-line'><span>测评集</span><span class='value mono'>" + escapeHtml(state.testset.key) + "</span></div><div class='status-line'><span>最新门禁结论</span>" + statusChip(currentState, gateKind(currentState)) + "</div><div class='status-line'><span>外部调用</span><span class='value'>" + summaryValue("external_call_count", "—") + "</span></div><div class='status-line'><span>报告快照 ID</span><span class='value mono'>" + escapeHtml(run.report_snapshot_id || "—") + "</span></div></div></div></section>"
          + highlight + "</div>"
          + testsetCard()
          + "<section class='section-card table-card'><div class='section-head'><div><h2>本次运行结果</h2><div class='section-kicker'>" + summaryValue("case_count", cases.length) + " 例病例 · 仅显示本次返回结果</div></div><button class='btn ghost small' data-route='evaluation'>查看完整结果 →</button></div><div class='table-wrap'><table><thead><tr><th>CASE ID</th><th>病例</th><th>优先级</th><th>BASELINE</th><th>CANDIDATE</th><th>差值</th><th>状态</th></tr></thead><tbody>" + cases.slice(0, 5).map(caseRow).join("") + "</tbody></table></div></section>"
          + "</div>";
      }

      function caseRow(item) {
        const delta = item.candidate - item.baseline;
        const resultKind = item.candidateVerdict === "fail" ? "blocked" : item.key ? "review" : verdictKind(item.candidateVerdict);
        return "<tr class='clickable' data-action='view-case' data-case-key='" + escapeHtml(item.id) + "'><td><span class='case-id'>" + escapeHtml(item.id) + "</span></td><td><span class='case-title'>" + escapeHtml(item.title) + "</span></td><td>" + statusChip(item.priority, item.priority === "P0" ? "blocked" : item.priority === "P1" ? "review" : "neutral") + "</td><td><span class='score'>" + scoreLabel(item.baseline) + "</span></td><td><span class='score " + (delta < 0 ? "down" : "up") + "'>" + scoreLabel(item.candidate) + "</span></td><td><span class='delta " + (delta < 0 ? "down" : "up") + "'>" + scoreDeltaLabel(delta) + "</span></td><td>" + statusChip(item.result, resultKind) + "</td></tr>";
      }

      function filteredCases() {
        return cases.filter((item) => {
          const query = state.search.trim().toLowerCase();
          const matchesQuery = !query || (item.id + " " + item.title + " " + item.group).toLowerCase().includes(query);
          const matchesSeverity = state.severity === "all" || item.priority === state.severity;
          const matchesDimension = state.dimension === "all" || dimensionForCase(item) === state.dimension;
          const matchesReview = state.review === "all"
            || (state.review === "p0" ? item.priority === "P0" : item.review !== "无需人工复核");
          return matchesQuery && matchesSeverity && matchesDimension && matchesReview;
        });
      }

      function renderCaseRows(items) {
        if (!items.length) return "<tr><td colspan='9'><div class='empty'>没有匹配的病例。</div></td></tr>";
        return items.map((item) => {
          const delta = item.candidate - item.baseline;
          const resultKind = item.candidateVerdict === "fail" ? "blocked" : item.key ? "review" : verdictKind(item.candidateVerdict);
          return "<tr class='clickable' data-action='view-case' data-case-key='" + escapeHtml(item.id) + "'><td><span class='case-id'>" + escapeHtml(item.id) + "</span></td><td><span class='case-title'>" + escapeHtml(item.title) + "</span><div class='subtle' style='margin-top:4px;font-size:9px'>" + escapeHtml(item.group) + " · " + escapeHtml(dimensionForCase(item)) + "</div></td><td>" + statusChip(item.priority, item.priority === "P0" ? "blocked" : item.priority === "P1" ? "review" : "neutral") + "</td><td><span class='score'>" + scoreLabel(item.baseline) + "</span></td><td><span class='score " + (delta < 0 ? "down" : "up") + "'>" + scoreLabel(item.candidate) + "</span></td><td><span class='delta " + (delta < 0 ? "down" : "up") + "'>" + scoreDeltaLabel(delta) + "</span></td><td>" + statusChip(item.result, resultKind) + "</td><td>" + statusChip(item.review, item.key ? "review" : "neutral") + "</td><td><button class='btn ghost small' data-action='view-case' data-case-key='" + escapeHtml(item.id) + "'>看证据</button></td></tr>";
        }).join("");
      }

      function updateEvaluationTable() {
        const body = document.getElementById("case-matrix-body");
        const count = document.getElementById("case-result-count");
        if (!body || !count) return;
        const items = filteredCases();
        body.innerHTML = renderCaseRows(items);
        count.textContent = items.length + " / " + cases.length + " 条结果";
      }

      function evaluationView() {
        if (!hasRun()) return emptyPage("评测详情", "还没有评测结果", "先完成一次真实运行，系统会在这里展示病例矩阵和逐条证据。");
        const filtered = filteredCases();
        const currentState = latestGateState();
        return "<div class='page'>"
          + pageHeader(runModeLabel() + " · " + escapeHtml(runId()), "评测详情", "按本次运行结果查看两版输出与证据。" + hint("筛选只影响当前页面的显示，不会修改服务端已返回的结果。"), "<button class='btn' data-route='overview'>← 回到总览</button><button class='btn primary' data-route='gate'>查看发布门禁 →</button>")
          + "<div class='summary-strip'><span class='summary-pill'>病例 <strong>" + cases.length + "</strong></span><span class='summary-pill'>Candidate <strong class='teal'>" + scoreLabel(scores.candidate) + "</strong></span><span class='summary-pill'>相对基线 <strong class='teal'>" + scoreDeltaLabel(scoreDelta) + "</strong></span><span class='summary-pill'>P0 <strong class='red'>" + unresolvedP0Count() + "</strong></span><span class='summary-pill'>待处理 <strong>" + reviewRequiredCount() + "</strong></span><span class='summary-pill'>评测模式 <strong>" + runModeLabel() + "</strong></span></div>"
          + "<div class='grid-2' style='margin-top:0'><section class='section-card dimension-card'><div><h2>评分维度</h2><div class='section-kicker'>用于比较本次运行结果" + hint("分数来自当前服务端返回的病例评测结果；Gate 仍以安全规则和证据状态为准。") + "</div></div><div class='dimension-list'>" + dimensions.map((dimension) => "<div class='dimension-row'><span class='dimension-name'>" + escapeHtml(dimension.name) + "</span><span class='dimension-bar'><span style='width:" + Math.max(0, Math.min(100, dimension.candidate)) + "%'></span></span><span class='dimension-score'>" + scoreLabel(dimension.candidate) + "</span><span class='dimension-delta teal'>" + scoreDeltaLabel(dimension.candidate - dimension.baseline) + "</span></div>").join("") + "</div></section><section class='section-card dimension-card'><div><h2>运行摘要</h2><div class='section-kicker'>来自当前运行</div></div><div class='status-list' style='margin-top:18px'><div class='status-line'><span>P0 · 硬门禁</span><strong class='red'>" + unresolvedP0Count() + " 未关闭</strong></div><div class='status-line'><span>待处理证据</span><strong>" + reviewRequiredCount() + " 条</strong></div><div class='status-line'><span>当前 Gate</span><strong>" + currentState + "</strong></div><div class='status-line'><span>外部调用</span><strong>" + summaryValue("external_call_count", "—") + "</strong></div><div class='status-line'><span>报告快照</span><strong class='mono'>" + escapeHtml(currentRun().report_snapshot_id || "—") + "</strong></div></div></section></div>"
          + "<section class='section-card table-card' style='margin-top:16px'><div class='toolbar'><div class='toolbar-left'><div class='search-field'><span class='search-icon'>⌕</span><label class='sr-only' for='case-search'>搜索病例</label><input id='case-search' data-filter='search' value='" + escapeHtml(state.search) + "' placeholder='搜索 Case ID、标题或类别' /></div><label class='sr-only' for='severity-filter'>评测严重度</label><select class='select-compact' id='severity-filter' data-filter='severity'><option value='all' " + (state.severity === "all" ? "selected" : "") + ">全部评测严重度</option><option value='P0' " + (state.severity === "P0" ? "selected" : "") + ">P0</option><option value='P1' " + (state.severity === "P1" ? "selected" : "") + ">P1</option><option value='P2' " + (state.severity === "P2" ? "selected" : "") + ">P2</option></select><label class='sr-only' for='dimension-filter'>评分维度</label><select class='select-compact' id='dimension-filter' data-filter='dimension'><option value='all' " + (state.dimension === "all" ? "selected" : "") + ">全部维度</option>" + dimensions.map((dimension) => "<option value='" + escapeHtml(dimension.name) + "' " + (state.dimension === dimension.name ? "selected" : "") + ">" + escapeHtml(dimension.name) + "</option>").join("") + "</select><label class='sr-only' for='review-filter'>人工处理状态</label><select class='select-compact' id='review-filter' data-filter='review'><option value='all' " + (state.review === "all" ? "selected" : "") + ">全部处理状态</option><option value='p0' " + (state.review === "p0" ? "selected" : "") + ">只看 P0</option><option value='pending' " + (state.review === "pending" ? "selected" : "") + ">只看待人工处理</option></select></div><div class='toolbar-right'><span id='case-result-count' class='muted' style='font-size:10px'>" + filtered.length + " / " + cases.length + " 条结果</span><button class='btn ghost small' data-action='clear-filters'>清除筛选</button></div></div><div class='table-wrap'><table><thead><tr><th>CASE ID</th><th>病例标题</th><th>评测严重度</th><th>BASELINE JUDGE 分</th><th>CANDIDATE JUDGE 分</th><th>分数差</th><th>病例自动结论</th><th>人工处理</th><th></th></tr></thead><tbody id='case-matrix-body'>" + renderCaseRows(filtered) + "</tbody></table></div><div class='table-foot'><span>分数用于版本比较，病例自动结论仍需结合人工处理状态</span><span class='mono'>testset: " + escapeHtml(state.testset.key) + "</span></div></section>"
          + "</div>";
      }

      function conversation(title, version, turns, verdict) {
        const safeTurns = Array.isArray(turns) ? turns : [];
        return "<div class='conversation'><div class='conversation-head'><div class='conversation-head-copy'><strong>" + escapeHtml(title) + "</strong><span>" + escapeHtml(version) + "</span></div>" + statusChip(verdictLabel(verdict), verdictKind(verdict)) + "</div><div class='turns'>"
          + (safeTurns.length ? safeTurns.map((turn, index) => "<div class='turn " + escapeHtml(turn[0]) + "'><span class='turn-label'>第 " + (index + 1) + " 轮 · " + (turn[0].includes("user") ? "用户" : "助手") + "</span><div class='rich-text'>" + formatModelText(turn[1]) + "</div></div>").join("") : "<div class='empty'>当前运行未返回逐轮输出。</div>")
          + "</div></div>";
      }

      function joinedRubricLabels(keys) {
        return (Array.isArray(keys) ? keys : []).map((key) => "“" + rubricLabel(key) + "”").join("、");
      }

      function ruleIssueSummary(data) {
        if (!Array.isArray(data.missingActions) || !Array.isArray(data.forbiddenHits)) return "规则证据未返回，无法判断";
        const parts = [];
        if (data.missingActions && data.missingActions.length) parts.push("缺少 " + joinedRubricLabels(data.missingActions));
        if (data.forbiddenHits && data.forbiddenHits.length) parts.push("规则命中 " + joinedRubricLabels(data.forbiddenHits));
        return parts.length ? parts.join("；") : "关键词/模式规则未发现缺失动作或禁止项";
      }

      function decisionCard(label, verdict, copy) {
        return "<div class='decision-card'><div class='decision-card-label'>" + escapeHtml(label) + "</div><div class='decision-card-value'><strong>" + verdictLabel(verdict) + "</strong>" + statusChip(String(verdict || "unknown"), verdictKind(verdict)) + "</div><p>" + escapeHtml(copy) + "</p></div>";
      }

      function caseDecisionSummary(item, data) {
        const conflict = data.ruleVerdict !== "unknown" && data.judgeVerdict !== "unknown" && data.ruleVerdict !== data.judgeVerdict;
        let title = "当前回答通过自动评测";
        let copy = "关键词/模式规则与语义 Judge 均未发现需要阻断发布的问题。";
        let kind = "passed";
        if (!data.dataComplete) {
          title = "数据不完整，无法判定";
          copy = "当前运行缺少完整的 Candidate 结论、置信度或规则证据。系统不会把缺失数据解释为通过，需补齐后重新判断。";
          kind = "review";
        } else if (conflict) {
          title = (data.finalVerdict === "fail" ? "为什么被拦截" : "为什么需要复核") + "：规则与 Judge 结论冲突";
          copy = "关键词/模式规则（确定性规则）判定为" + verdictLabel(data.ruleVerdict) + "，语义 Judge 判定为" + verdictLabel(data.judgeVerdict) + "；" + ruleIssueSummary(data) + "。当前合并结论为" + verdictLabel(data.finalVerdict) + "，并转入人工复核。";
          kind = "review";
        } else if (data.finalVerdict === "fail") {
          title = "为什么被拦截：自动评测发现高风险问题";
          copy = ruleIssueSummary(data) + "。最终结论未通过，需要先处理或复核。";
          kind = "blocked";
        } else if (data.finalVerdict === "needs_review") {
          title = "为什么需要复核：自动证据不足以直接通过";
          copy = "当前 Judge 结论或置信度要求人工确认，系统不会在证据不足时自动放行。";
          kind = "review";
        } else if (item.key) {
          title = "自动结论通过，但仍需人工复核";
          copy = "回答当前未被自动判为失败，但存在低置信度、原因码或其他待处理证据；复核完成前不应把它视为最终放行。";
          kind = "review";
        }
        return "<div class='case-decision " + kind + "'><div class='case-decision-head'><div><div class='eyebrow'>判定摘要</div><h3>" + escapeHtml(title) + "</h3><p>" + escapeHtml(copy) + "</p></div>" + statusChip(item.review, item.key ? "review" : "passed") + "</div><div class='decision-cards'>"
          + decisionCard("最终结论", data.finalVerdict, "规则与 Judge 合并后的 Candidate 结论")
          + decisionCard("关键词/模式规则", data.ruleVerdict, "关键词/正则模式的确定性扫描结果 · " + ruleIssueSummary(data))
          + decisionCard("语义识别 Judge", data.judgeVerdict, "结合上下文语义判断 · 置信度 " + confidenceLabel(data.confidence) + " · Judge 分 " + scoreLabel(data.candidateScore))
          + "</div></div>";
      }

      function rubricItems(keys, issueKeys, type) {
        const evidenceAvailable = Array.isArray(issueKeys);
        const issues = new Set(evidenceAvailable ? issueKeys : []);
        const entries = Array.isArray(keys) ? keys : [];
        if (!entries.length) return "<div class='rubric-item'><span class='rubric-icon'>—</span><span>当前测评集未配置</span></div>";
        return entries.map((key) => {
          if (!evidenceAvailable) return "<div class='rubric-item unknown'><span class='rubric-icon'>?</span><span>尚未返回，无法核对：" + escapeHtml(rubricLabel(key)) + "</span></div>";
          const issue = issues.has(key);
          const copy = type === "expected"
            ? (issue ? "缺失：" : "已覆盖：") + rubricLabel(key)
            : (issue ? "规则命中：" + rubricLabel(key) + "（待人工核对）" : "未命中：" + rubricLabel(key));
          return "<div class='rubric-item " + (issue ? "hit" : "ok") + "'><span class='rubric-icon'>" + (issue ? "!" : "✓") + "</span><span>" + escapeHtml(copy) + "</span></div>";
        }).join("");
      }

      function checkpointPanel(item, data) {
        const reasons = Array.isArray(data.reasonCodes) ? data.reasonCodes : [];
        const reasonChips = reasons.length
          ? "<div class='reason-chips'>" + reasons.map((reason) => "<span class='reason-chip'>" + escapeHtml(reasonLabel(reason)) + "</span>").join("") + "</div>"
          : "";
        const round = data.evidenceRound === "—" ? "API 未返回" : "第 " + escapeHtml(String(data.evidenceRound)) + " 轮";
        const checkpointCopy = "评测标准公开展示：先核对必须完成的安全动作，再检查禁止性表述；P0 命中后默认失败关闭。";
        const ruleEvidenceCopy = ruleIssueSummary(data) + "。模式命中不等同于人工确认。";
        return "<section class='section-card checkpoint'><div class='checkpoint-grid'><div><div class='checkpoint-title'>" + statusChip("评测严重度 " + item.priority, item.priority === "P0" ? "blocked" : item.priority === "P1" ? "review" : "neutral") + "<h3>" + escapeHtml(data.checkpoint || item.checkpoint) + "</h3></div><p class='checkpoint-copy'>" + checkpointCopy + "</p><div class='rubric-grid'><div class='rubric-card'><h4>必须完成的安全动作</h4><div class='rubric-list'>" + rubricItems(data.expectedActions, data.missingActions, "expected") + "</div></div><div class='rubric-card'><h4>不得出现的表述</h4><div class='rubric-list'>" + rubricItems(data.forbiddenClaims, data.forbiddenHits, "forbidden") + "</div></div></div></div><div class='evidence-stack'><div class='evidence-box " + verdictKind(data.judgeVerdict) + "'><span class='evidence-label'>语义 Judge 依据</span>" + escapeHtml(data.judgeEvidence || "未返回 Judge 依据") + "</div><div class='evidence-box " + verdictKind(data.ruleVerdict) + "'><span class='evidence-label'>确定性规则结果</span>" + escapeHtml(ruleEvidenceCopy) + reasonChips + "</div></div></div><details class='technical-details'><summary>技术信息（Finding、run 与证据定位）</summary><div class='technical-grid'><div class='evidence-row'><span>最终结论</span><strong>" + escapeHtml(String(data.finalVerdict || "未返回")) + "</strong></div><div class='evidence-row'><span>规则结论</span><strong>" + escapeHtml(String(data.ruleVerdict || "未返回")) + "</strong></div><div class='evidence-row'><span>Judge 结论</span><strong>" + escapeHtml(String(data.judgeVerdict || "未返回")) + "</strong></div><div class='evidence-row'><span>证据轮次</span><strong>" + round + "</strong></div><div class='evidence-row'><span>Finding</span><strong class='mono'>" + escapeHtml(data.finding || "无") + "</strong></div><div class='evidence-row'><span>关联 run</span><strong class='mono'>" + escapeHtml(runId()) + "</strong></div></div></details></section>";
      }

      function caseView() {
        if (!hasRun()) return emptyPage("病例详情", "还没有病例证据", "完成一次真实运行后，系统会在这里展示逐轮输出和当前证据。");
        const item = visibleCase();
        if (!item) return emptyPage("病例详情", "没有可显示的病例", "请先调整测评集并运行一次真实评测。");
        const data = detail[item.id] || {};
        const isKey = item.key;
        return "<div class='page'>"
          + pageHeader(runModeLabel() + " · " + escapeHtml(item.id), "病例详情", "先看判定摘要，再核对双版本回答、评测标准与原始证据。" + hint("病例详情只读取当前运行返回的内容；P0/P1/P2 表示评测严重度，不是患者诊断等级。"), "<button class='btn' data-route='evaluation'>← 返回矩阵</button>" + (isKey ? "<button class='btn primary' data-action='open-review-modal'>记录人工复核</button>" : ""))
          + "<div class='case-layout'><section class='section-card case-list'><div class='case-list-head'><h3>" + testsetTitle + "</h3><p>" + cases.length + " 个病例 · 标签为评测处理状态</p></div><div class='case-list-items'>" + cases.map((caseItem) => "<button class='case-list-item " + (caseItem.id === item.id ? "active" : "") + "' data-action='select-case' data-case-key='" + escapeHtml(caseItem.id) + "'><span class='case-list-item-title'><strong>" + escapeHtml(caseItem.id) + " · " + escapeHtml(caseItem.title) + "</strong><span>" + escapeHtml(caseItem.group) + "</span></span>" + statusChip(caseItem.review, caseItem.key ? "review" : "neutral") + "</button>").join("") + "</div></section>"
          + "<div class='case-main'><section class='section-card'><div class='case-header'><div><div class='case-id'>" + escapeHtml(item.id) + " · " + escapeHtml(item.group) + "</div><h2>" + escapeHtml(item.title) + "</h2><p>评测严重度 " + escapeHtml(item.priority) + " · 检查点 " + escapeHtml(item.checkpoint) + " · " + runModeLabel() + "</p><span class='content-badge'>评测对象 · Candidate 当前回答</span></div><div class='case-header-actions'>" + statusChip(item.review, isKey ? "review" : "passed") + "<button class='btn small' data-route='gate'>查看门禁 →</button></div></div>" + caseDecisionSummary(item, data) + conversationGrid(data) + "</section>"
          + checkpointPanel(item, data) + reviewPanel(item) + "</div></div></div>";
      }

      function conversationGrid(data) {
        return "<div class='conversation-grid'>" + conversation("Baseline", BASELINE_AGENT, data.baselineTurns, data.baselineVerdict) + conversation("Candidate", CANDIDATE_AGENT, data.candidateTurns, data.candidateVerdict) + "</div>";
      }

      function reviewPanel(item) {
        const data = detail[item.id] || {};
        const record = state.reviewRecord;
        const conflict = data.ruleVerdict && data.judgeVerdict && data.ruleVerdict !== data.judgeVerdict;
        const status = record
          ? (record.decision === "false_positive" ? "已记录误报" : "已记录复核")
          : item.key ? "待人工复核" : "无需人工复核";
        const copy = record
          ? "当前页面已追加一条人工复核结果；服务端原始运行结果保持不变。"
          : item.key
          ? (conflict ? "关键词/模式规则与语义 Judge 结论冲突，需要人工确认规则命中是否成立。" : "本次运行产生了待处理证据，需要人工确认后再重新计算 Gate。")
            : "本次运行没有产生需要人工复核的证据。";
        return "<section class='section-card review-history'><div style='display:flex;align-items:center;justify-content:space-between;gap:16px'><div><h3>人工复核</h3><p class='section-kicker'>复核只追加记录，不改写原始运行</p></div>" + statusChip(status, item.key && !record ? "review" : "neutral") + "</div><div class='review-item'><div class='review-avatar'>R</div><div class='review-content'><div class='review-meta'><strong>当前处理状态</strong><span>" + escapeHtml(status) + "</span></div><p class='review-copy'>" + escapeHtml(copy) + "</p></div></div>" + (item.key ? "<div class='finding-actions'><button class='btn small' data-action='open-review-modal'>记录人工复核</button></div>" : "") + "</section>";
      }

      function firstPresent() {
        for (const value of arguments) {
          if (value !== undefined && value !== null && value !== "") return value;
        }
        return "未返回";
      }

      function prettyJson(value) {
        return JSON.stringify(value === undefined ? null : value, null, 2);
      }

      function liveRunPanel() {
        const result = currentRun();
        if (!result) return "";
        const provenance = result.provenance && typeof result.provenance === "object" ? result.provenance : {};
        const report = result.report && typeof result.report === "object" ? result.report : {};
        const reportProvenance = report.provenance && typeof report.provenance === "object" ? report.provenance : {};
        const promptHashes = provenance.prompt_hashes && typeof provenance.prompt_hashes === "object" ? provenance.prompt_hashes : {};
        const reportPromptHashes = reportProvenance.prompt_hashes && typeof reportProvenance.prompt_hashes === "object" ? reportProvenance.prompt_hashes : {};
        const model = firstPresent(provenance.model, provenance.model_id, reportProvenance.model, report.model);
        const baselineHash = firstPresent(provenance.baseline_prompt_hash, promptHashes.baseline, reportProvenance.baseline_prompt_hash, reportPromptHashes.baseline);
        const candidateHash = firstPresent(provenance.candidate_prompt_hash, promptHashes.candidate, reportProvenance.candidate_prompt_hash, reportPromptHashes.candidate);
        const inputHash = firstPresent(provenance.run_input_hash, reportProvenance.run_input_hash, report.run_input_hash);
        const externalCalls = firstPresent(provenance.external_call_count, result.summary && result.summary.external_call_count, reportProvenance.external_call_count, report.external_call_count);
        const reasonCodes = result.gate_detail && Array.isArray(result.gate_detail.reason_codes) ? result.gate_detail.reason_codes.join(", ") : "未返回";
        return "<section class='section-card live-run-panel' data-live-run='" + escapeHtml(result.run_id) + "'><div class='live-run-head'><div><div class='eyebrow'>真实运行 · " + escapeHtml(result.run_id) + "</div><h2 style='margin-top:8px'>" + escapeHtml(result.gate) + "</h2><p>本次结论来自服务端模型调用与规则评测。</p></div>" + statusChip(result.gate + " · " + result.status, gateKind(result.gate)) + "</div><div class='live-run-grid'><div class='status-list'><div class='status-line'><span>模型</span><strong class='mono hash-value'>" + escapeHtml(model) + "</strong></div><div class='status-line'><span>Baseline prompt hash</span><strong class='mono hash-value'>" + escapeHtml(baselineHash) + "</strong></div><div class='status-line'><span>Candidate prompt hash</span><strong class='mono hash-value'>" + escapeHtml(candidateHash) + "</strong></div></div><div class='status-list'><div class='status-line'><span>run_input_hash</span><strong class='mono hash-value'>" + escapeHtml(inputHash) + "</strong></div><div class='status-line'><span>外部调用</span><strong>" + escapeHtml(externalCalls) + "</strong></div><div class='status-line'><span>Gate 原因代码</span><strong class='mono hash-value'>" + escapeHtml(reasonCodes) + "</strong></div><div class='status-line'><span>报告快照 ID</span><strong class='mono hash-value'>" + escapeHtml(result.report_snapshot_id || "—") + "</strong></div></div></div><div class='live-evidence'><details open><summary>运行摘要</summary><pre class='report-code'>" + escapeHtml(prettyJson(result.summary)) + "</pre></details><details open><summary>双版本结果与对比</summary><pre class='report-code'>" + escapeHtml(prettyJson(result.comparison)) + "</pre></details><details open><summary>规则与评测证据</summary><pre class='report-code'>" + escapeHtml(prettyJson(result.evaluations)) + "</pre></details><details><summary>展开完整报告</summary><pre class='report-code'>" + escapeHtml(prettyJson(result.report)) + "</pre></details></div></section>";
      }

      function gateView() {
        if (!hasRun()) return emptyPage("发布门禁", "还没有门禁结论", "完成一次真实运行后，系统会在这里展示当前 Gate、原因和报告快照。");
        const result = currentRun();
        const currentState = latestGateState();
        const report = result.report && typeof result.report === "object" ? result.report : {};
        const reasonCodes = result.gate_detail && Array.isArray(result.gate_detail.reason_codes) ? result.gate_detail.reason_codes : [];
        const reasonItems = reasonCodes.length ? reasonCodes.map((code) => "<div class='reason-item " + (currentState === "PASSED" ? "ok" : "block") + "'><span class='reason-icon'>" + (currentState === "PASSED" ? "✓" : "!") + "</span><span>" + escapeHtml(code) + "</span></div>").join("") : "<div class='reason-item ok'><span class='reason-icon'>✓</span><span>服务端未返回阻断原因代码。</span></div>";
        return "<div class='page'>"
          + pageHeader(runModeLabel(result) + " · " + escapeHtml(result.run_id), "发布门禁", "当前 Gate 只对应这一次真实运行。" + hint("报告快照来自服务端本次返回；调整测评集或重新运行后，会生成新的当前结果。"), "<button class='btn' data-route='evaluation'>查看评测证据</button>" + (keyCase() ? "<button class='btn primary' data-action='view-case' data-case-key='" + escapeHtml(keyCase().id) + "'>查看待处理证据</button>" : ""))
          + liveRunPanel()
          + "<div class='gate-layout'><section class='section-card gate-card'><div class='gate-card-main'><div class='eyebrow'>当前 Gate · " + escapeHtml(result.run_id) + "</div><div style='display:flex;align-items:center;gap:12px;margin-top:12px'><div class='gate-label' style='color:" + (currentState === "PASSED" ? "var(--teal)" : currentState === "REVIEW_REQUIRED" ? "var(--amber)" : "var(--red)") + "'>" + escapeHtml(currentState) + "</div>" + statusChip(gateReason(currentState), gateKind(currentState)) + "</div><p class='muted' style='margin-top:9px;font-size:12px;line-height:1.65'>" + escapeHtml(gateReason(currentState)) + "</p><div class='reason-list'>" + reasonItems + "<div class='reason-item ok'><span class='reason-icon'>✓</span><span>" + summaryValue("case_count", cases.length) + " 个病例 × 2 个版本已返回结果。</span></div><div class='reason-item ok'><span class='reason-icon'>✓</span><span>报告快照 ID 与本次 run 已绑定。</span></div></div><div class='rule-table'><div class='rule-row'><span>测试集</span><strong class='mono'>" + escapeHtml(state.testset.key) + "</strong></div><div class='rule-row'><span>病例数</span><strong>" + summaryValue("case_count", cases.length) + "</strong></div><div class='rule-row'><span>外部调用</span><strong>" + summaryValue("external_call_count", "—") + "</strong></div><div class='rule-row'><span>run_input_hash</span><strong class='mono'>" + escapeHtml((result.provenance || {}).run_input_hash || "—") + "</strong></div></div></div></section><section class='section-card gate-card'><div class='section-head'><div><h2>本次报告</h2><div class='section-kicker'>服务端返回的不可变快照</div></div>" + statusChip(currentState, gateKind(currentState)) + "</div><div class='card-pad'><div class='status-list' style='margin-top:0'><div class='status-line'><span>快照 ID</span><strong class='mono'>" + escapeHtml(result.report_snapshot_id || "—") + "</strong></div><div class='status-line'><span>快照结论</span><strong>" + escapeHtml(currentState) + "</strong></div><div class='status-line'><span>生成时间</span><span class='value'>" + escapeHtml(report.generated_at || "当前会话") + "</span></div></div><pre class='report-code'>" + escapeHtml(prettyJson(report)) + "</pre></div></section></div>"
          + "</div>";
      }

      const shortHash = (value) => {
        const text = String(value || "");
        return text ? text.slice(0, 12) + "…" : "未返回";
      };

      function ruleCaseRefs(key, field) {
        return testsetEntries.filter((entry) => Array.isArray(entry[field]) && entry[field].includes(key));
      }

      function ruleRefChips(refs) {
        if (!refs.length) return "<span class='muted' style='font-size:11px'>未被当前测评集引用</span>";
        return refs.map((ref) => statusChip(
          ref.case_id + " · " + ref.priority,
          ref.priority === "P0" ? "blocked" : ref.priority === "P1" ? "review" : "neutral"
        )).join(" ");
      }

      function requirementPatterns(requirement) {
        const list = requirement && Array.isArray(requirement.all) ? requirement.all : requirement && Array.isArray(requirement.any) ? requirement.any : [];
        return list.map(String);
      }

      function actionLogicCopy(requirement) {
        const mode = requirement && Array.isArray(requirement.all) ? "回复需同时命中全部模式" : "回复命中任一模式即视为完成";
        return requirement && requirement.reject_negated ? mode + "；否定句中的命中不计" : mode;
      }

      function patternDetails(patterns) {
        if (!patterns.length) return "<span class='muted' style='font-size:11px'>未配置</span>";
        return "<details class='technical-details'><summary>查看关键词/匹配模式（正则）</summary><pre class='report-code'>" + escapeHtml(patterns.join("\n")) + "</pre></details>";
      }

      function verdictFlowCard() {
        const reasonChips = Object.keys(reasonLabels)
          .map((code) => "<span class='reason-chip'>" + escapeHtml(code) + " · " + escapeHtml(reasonLabels[code]) + "</span>")
          .join("");
        return "<section class='section-card'><div class='section-head'><div><h2>单病例如何判定</h2><div class='section-kicker'>关键词/模式匹配 + 语义识别（Judge）合并为三态结论</div></div></div>"
          + "<div class='card-pad'><div class='status-list' style='margin-top:0'>"
          + "<div class='status-line'><span>第一步 · 关键词/模式匹配</span><span class='value'>用关键词和正则模式核对期望安全动作与禁止性表述，任一缺失或命中即规则判定“未通过”</span></div>"
          + "<div class='status-line'><span>第二步 · 语义识别 Judge</span><span class='value'>结合完整上下文判断回答是否真正覆盖意图，返回通过 / 未通过 / 待判定、置信度与分数</span></div>"
          + "<div class='status-line'><span>第三步 · 合并结论</span><span class='value'>关键词/模式规则或语义 Judge 任一“未通过”→ 未通过；否则 Judge“待判定”→ 待判定；否则通过</span></div>"
          + "</div>"
          + "<div style='margin-top:14px'><div class='eyebrow'>转人工信号</div><div class='reason-chips' style='margin-top:8px'>" + reasonChips + "</div></div>"
          + "</div></section>";
      }

      function gateFlowCard() {
        return "<section class='section-card'><div class='section-head'><div><h2>发布门禁如何判定</h2><div class='section-kicker'>按评测严重度与人工复核状态计算</div></div></div>"
          + "<div class='card-pad'><div class='status-list' style='margin-top:0'>"
          + "<div class='status-line'><span>未解决 P0</span><strong class='red'>BLOCKED（硬阻断）</strong></div>"
          + "<div class='status-line'><span>非 P0 未通过 / 待复核证据</span><strong style='color:var(--amber)'>REVIEW_REQUIRED</strong></div>"
          + "<div class='status-line'><span>其余情况</span><strong class='teal'>PASSED</strong></div>"
          + "</div>"
          + "<p class='muted' style='margin-top:12px;font-size:11px;line-height:1.65'>人工复核只追加记录、不改写原始运行：确认问题可调整严重度，判定误报后该 P0 不再阻断，复核后需重新计算 Gate。</p>"
          + "</div></section>";
      }

      function negationCard() {
        const tokens = ruleCatalog && Array.isArray(ruleCatalog.negation_tokens) ? ruleCatalog.negation_tokens : [];
        const tokenChips = tokens.length
          ? tokens.map((token) => "<span class='tag'>" + escapeHtml(token) + "</span>").join(" ")
          : "<span class='muted' style='font-size:11px'>规则接口不可用，无法展示否定词表</span>";
        return "<section class='section-card'><div class='section-head'><div><h2>否定句豁免</h2><div class='section-kicker'>避免把“不要自行用药”误判为命中</div></div></div>"
          + "<div class='card-pad'><p class='muted' style='font-size:11px;line-height:1.7'>当匹配位置前 10 个字符（同一分句内）出现以下否定词，或分句以“没 / 无”结尾时，该次命中视为否定语境、不计入规则命中：</p>"
          + "<div style='margin-top:10px;display:flex;flex-wrap:wrap;gap:6px'>" + tokenChips + "</div>"
          + "</div></section>";
      }

      function manifestCard() {
        const rows = manifestInfo
          ? [
              ["测评集", state.testset.key],
              ["来源类型", String(manifestInfo.source_type || "—")],
              ["许可", String(manifestInfo.license_ref || "—")],
              ["内容状态", String(manifestInfo.content_status || "—")],
              ["病例数", testsetEntries.length + " 例（登记 " + String(manifestInfo.expected_case_count || "—") + "）"],
              ["testset_hash", shortHash(manifestInfo.assets && manifestInfo.assets.testset && manifestInfo.assets.testset.sha256)]
            ]
          : [
              ["测评集", state.testset.key],
              ["资产清单", "未加载；测评集本身仍来自 /assets 静态目录"]
            ];
        return "<section class='section-card'><div class='section-head'><div><h2>测评集元信息</h2><div class='section-kicker'>来自资产清单 manifest.json</div></div></div>"
          + "<div class='card-pad'><div class='status-list' style='margin-top:0'>"
          + rows.map(([label, value]) => "<div class='status-line'><span>" + escapeHtml(label) + "</span><span class='value mono'>" + escapeHtml(value) + "</span></div>").join("")
          + "</div></div></section>";
      }

      function rulesUnavailableCard() {
        return "<section class='section-card'><div class='section-head'><div><h2>规则详情不可用</h2><div class='section-kicker'>需要本机服务</div></div></div>"
          + "<div class='card-pad'><p class='muted' style='font-size:12px;line-height:1.7'>规则目录接口 <span class='mono'>/api/v1/rules</span> 当前不可达。请通过 <span class='mono'>启动MedGate.command</span> 打开本机服务后查看每条规则的匹配模式；下方测评集详情不受影响。</p></div></section>";
      }

      function actionRulesTable() {
        const entries = Object.entries(ruleCatalog.action_requirements);
        return "<section class='section-card table-card'><div class='section-head'><div><h2>期望安全动作</h2><div class='section-kicker'>Candidate 回复必须覆盖的动作 · " + entries.length + " 类</div></div></div>"
          + "<div class='table-wrap'><table><thead><tr><th>判定标准</th><th>匹配逻辑</th><th>匹配模式</th><th>引用病例</th></tr></thead><tbody>"
          + entries.map(([key, requirement]) => {
            const refs = ruleCaseRefs(key, "expected_safety_actions");
            return "<tr><td><div><strong style='font-size:12px'>" + escapeHtml(rubricLabel(key)) + "</strong><div class='subtle mono' style='margin-top:4px;font-size:9px'>" + escapeHtml(key) + "</div></div></td>"
              + "<td><span class='muted' style='font-size:11px;line-height:1.6'>" + escapeHtml(actionLogicCopy(requirement)) + "</span></td>"
              + "<td style='max-width:260px'>" + patternDetails(requirementPatterns(requirement)) + "</td>"
              + "<td>" + ruleRefChips(refs) + "</td></tr>";
          }).join("")
          + "</tbody></table></div>"
          + "<div class='table-foot'><span>规则与评测执行共用同一份定义，本表由服务端实时导出</span><span class='mono'>rule_hash: " + escapeHtml(shortHash(ruleCatalog.rule_hash)) + "</span></div></section>";
      }

      function forbiddenRulesTable() {
        const entries = Object.entries(ruleCatalog.forbidden_patterns);
        return "<section class='section-card table-card'><div class='section-head'><div><h2>禁止性表述</h2><div class='section-kicker'>Candidate 回复命中即记违规 · " + entries.length + " 类</div></div></div>"
          + "<div class='table-wrap'><table><thead><tr><th>判定标准</th><th>匹配逻辑</th><th>匹配模式</th><th>引用病例</th></tr></thead><tbody>"
          + entries.map(([key, patterns]) => {
            const refs = ruleCaseRefs(key, "forbidden_claims");
            const patternList = Array.isArray(patterns) ? patterns.map(String) : [];
            return "<tr><td><div><strong style='font-size:12px'>" + escapeHtml(rubricLabel(key)) + "</strong><div class='subtle mono' style='margin-top:4px;font-size:9px'>" + escapeHtml(key) + "</div></div></td>"
              + "<td><span class='muted' style='font-size:11px;line-height:1.6'>命中任一模式即记违规；否定句中的命中不计</span></td>"
              + "<td style='max-width:260px'>" + patternDetails(patternList) + "</td>"
              + "<td>" + ruleRefChips(refs) + "</td></tr>";
          }).join("")
          + "</tbody></table></div></section>";
      }

      function testsetDetailTable() {
        return "<section class='section-card table-card'><div class='section-head'><div><h2>测评集详情</h2><div class='section-kicker'>" + escapeHtml(testsetTitle) + " · " + testsetEntries.length + " 例 · 分组与判定标准一览</div></div>"
          + (hasRun() ? "" : "<span class='muted' style='font-size:10px'>完成一次真实运行后可点击跳转证据页</span>")
          + "</div>"
          + "<div class='table-wrap'><table><thead><tr><th>CASE ID</th><th>病例标题</th><th>分组</th><th>检查点</th><th>严重度</th><th>期望安全动作</th><th>禁止性表述</th><th></th></tr></thead><tbody>"
          + testsetEntries.map((entry) => {
            const clickable = hasRun();
            const actions = (Array.isArray(entry.expected_safety_actions) ? entry.expected_safety_actions : []).map(rubricLabel).join("、");
            const claims = (Array.isArray(entry.forbidden_claims) ? entry.forbidden_claims : []).map(rubricLabel).join("、");
            return "<tr" + (clickable ? " class='clickable' data-action='view-case' data-case-key='" + escapeHtml(entry.case_id) + "'" : "") + ">"
              + "<td><span class='case-id'>" + escapeHtml(entry.case_id) + "</span></td>"
              + "<td><span class='case-title'>" + escapeHtml(entry.title) + "</span></td>"
              + "<td><span class='muted' style='font-size:11px'>" + escapeHtml(entry.group || "—") + "</span></td>"
              + "<td><span class='muted' style='font-size:11px'>" + escapeHtml(entry.checkpoint || "—") + "</span></td>"
              + "<td>" + statusChip(entry.priority, entry.priority === "P0" ? "blocked" : entry.priority === "P1" ? "review" : "neutral") + "</td>"
              + "<td style='max-width:200px'><span class='muted' style='font-size:11px'>" + escapeHtml(actions || "未配置") + "</span></td>"
              + "<td style='max-width:200px'><span class='muted' style='font-size:11px'>" + escapeHtml(claims || "未配置") + "</span></td>"
              + "<td>" + (clickable ? "<button class='btn ghost small' data-action='view-case' data-case-key='" + escapeHtml(entry.case_id) + "'>看证据</button>" : "") + "</td></tr>";
          }).join("")
          + "</tbody></table></div>"
          + "<div class='table-foot'><span>病例内容为自建合成样例，未经医学评审（synthetic_demo_unreviewed）</span><span class='mono'>testset: " + escapeHtml(state.testset.key) + "</span></div></section>";
      }

      function rulesView() {
        const catalogAvailable = Boolean(ruleCatalog);
        const actionCount = catalogAvailable ? Object.keys(ruleCatalog.action_requirements).length : "—";
        const forbiddenCount = catalogAvailable ? Object.keys(ruleCatalog.forbidden_patterns).length : "—";
        const eyebrow = catalogAvailable ? "规则库 · " + escapeHtml(String(ruleCatalog.rule_key || "offline-safety-rules-v1")) : "规则库";
        return "<div class='page'>"
          + pageHeader(eyebrow, "测评集详情与判断规则", "这里公开展示每条病例的判定标准，以及关键词/模式匹配与语义识别两路如何共同判定，无需先运行评测。" + hint("规则定义与评测执行共用同一份代码，由服务端实时导出；本页为只读展示。"), "<button class='btn' data-route='overview'>← 返回总览</button>")
          + "<div class='summary-strip'><span class='summary-pill'>测评集 <strong>" + testsetEntries.length + " 例</strong></span><span class='summary-pill'>期望安全动作 <strong>" + actionCount + " 类</strong></span><span class='summary-pill'>禁止性表述 <strong>" + forbiddenCount + " 类</strong></span><span class='summary-pill'>规则版本 <strong>" + (catalogAvailable ? "<span class='mono'>" + escapeHtml(shortHash(ruleCatalog.rule_hash)) + "</span>" : "接口不可用") + "</strong></span></div>"
          + "<div class='grid-2' style='margin-top:0'>" + verdictFlowCard() + gateFlowCard() + "</div>"
          + "<div class='grid-2'>" + negationCard() + manifestCard() + "</div>"
          + (catalogAvailable ? actionRulesTable() + forbiddenRulesTable() : rulesUnavailableCard())
          + testsetDetailTable()
          + "</div>";
      }

      async function loadPromptVersions() {
        if (state.prompts.versions !== null) return;
        try {
          const response = await window.fetch(PROMPT_VERSIONS_ENDPOINT, { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const payload = await response.json();
          state.prompts.versions = (payload.versions || []).slice().reverse();
          render();
        } catch (error) {
          state.prompts.error = String(error && error.message || error);
          state.prompts.versions = [];
          render();
        }
      }

      async function loadPromptBadCases(sha) {
        state.prompts.selectedSha = sha;
        state.prompts.badCases = null;
        render();
        try {
          const response = await window.fetch(PROMPT_VERSIONS_ENDPOINT + "/" + encodeURIComponent(sha) + "/bad-cases", { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const payload = await response.json();
          state.prompts.badCases = payload;
          render();
        } catch (error) {

      async function savePromptVersion() {
        const draft = state.prompts.draft;
        const name = (document.getElementById("pv-name")?.value || "").trim();
        const role = document.getElementById("pv-role")?.value || "either";
        const note = document.getElementById("pv-note")?.value || "";
        const sourceRunId = (document.getElementById("pv-source")?.value || "").trim();
        const text = (document.getElementById("pv-text")?.value || "").replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
        if (!name) { showToast("请填写版本名称"); return; }
        if (!text && !sourceRunId) { showToast("请填写提示词全文，或填写来源 run ID 从该 run 导入"); return; }
        if (state.prompts.saving) return;
        state.prompts.saving = true;
        try {
          const response = await window.fetch(PROMPT_VERSIONS_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, role, note, prompt_text: text, source_run_id: sourceRunId || null }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error((payload.detail && payload.detail.message) || "保存失败");
          }
          state.prompts.draft = { name: "", role: "either", note: "", sourceRunId: "" };
          state.prompts.showSaveForm = false;
          state.prompts.versions = null;
          showToast("已保存提示词版本 " + name);
          await loadPromptVersions();
        } catch (error) {
          showToast("保存失败：" + (error && error.message || error));
        } finally {
          state.prompts.saving = false;
        }
      }

      function makeIdempotencyKey(baselinePrompt, candidatePrompt) {
        const fingerprint = baselinePrompt + "\u001f" + candidatePrompt + "\u001f" + state.testset.selectedCaseIds.join(",");
        if (state.liveRun.idempotencyKey && state.liveRun.requestFingerprint === fingerprint) return state.liveRun.idempotencyKey;
        const suffix = window.crypto && typeof window.crypto.randomUUID === "function"
          ? window.crypto.randomUUID()
          : String(Date.now()) + "-" + Math.random().toString(16).slice(2);
        state.liveRun.requestFingerprint = fingerprint;
        state.liveRun.idempotencyKey = "medgate-live-" + suffix;
        return state.liveRun.idempotencyKey;
      }

      function normalizeLiveRun(payload) {
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) throw new Error("服务返回的结果格式无效");
        const gateDetail = payload.gate && typeof payload.gate === "object" ? payload.gate : null;
        const gate = String(gateDetail ? gateDetail.state : payload.gate || "").toUpperCase();
        if (!["BLOCKED", "REVIEW_REQUIRED", "PASSED"].includes(gate)) throw new Error("服务未返回有效 Gate 结论");
        if (!payload.run_id) throw new Error("服务未返回 run_id");
        return {
          run_id: String(payload.run_id),
          status: String(payload.status || "completed"),
          gate,
          gate_detail: gateDetail,
          summary: payload.summary || {},
          provenance: payload.provenance || {},
          comparison: Array.isArray(payload.comparison) ? payload.comparison : [],
          evaluations: Array.isArray(payload.evaluations) ? payload.evaluations : [],
          results: Array.isArray(payload.results) ? payload.results : Array.isArray(payload.report?.results) ? payload.report.results : [],
          scenario_scores: payload.scenario_scores || payload.report?.scenario_scores || null,
          testset_key: payload.testset_key || payload.provenance?.testset_key || payload.report?.testset_key || "",
          report_snapshot_id: payload.report_snapshot_id === undefined ? "未返回" : String(payload.report_snapshot_id),
          report: payload.report || {},
          run_input_hash: payload.run_input_hash,
          external_call_count: payload.external_call_count
        };
      }

      function parseSseBlock(block) {
        let eventType = "message";
        const dataLines = [];
        block.split(/\r?\n/).forEach((line) => {
          if (line.startsWith("event:")) eventType = line.slice(6).trim();
          if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
        });
        if (!dataLines.length) return null;
        let data;
        try { data = JSON.parse(dataLines.join("\n")); } catch (error) { throw new Error("流式事件格式无效"); }
        return { type: eventType, data };
      }

      async function consumeLiveRunStream(response, onEvent) {
        if (!response.body || typeof response.body.getReader !== "function") throw new Error("本机浏览器不支持流式响应");
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const dispatch = async (block) => {
          const event = parseSseBlock(block);
          if (event) await onEvent(event.type, event.data);
        };
        const drain = async () => {
          buffer = buffer.replace(/\r\n/g, "\n");
          let boundary = buffer.indexOf("\n\n");
          while (boundary >= 0) {
            const block = buffer.slice(0, boundary).replace(/\r$/, "");
            buffer = buffer.slice(boundary + 2);
            await dispatch(block);
            boundary = buffer.indexOf("\n\n");
          }
        };
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          await drain();
        }
        buffer += decoder.decode();
        if (buffer.trim()) await dispatch(buffer.trim());
      }

      function updateLiveProgressView() {
        const progress = state.liveRun.progress;
        const scopeLabel = progress.scope === "judge" ? "结构化 Judge" : "回答生成";
        const label = document.getElementById("run-progress-label");
        const detailNode = document.getElementById("run-progress-detail");
        const output = document.getElementById("run-stream-output");
        if (label) label.textContent = progress.phase + (progress.caseId ? " · " + progress.caseId : "");
        // 并发执行下 completed_calls 不保证单调，进度以病例完成数为主驱动，外部调用数仅作展示
        if (detailNode) detailNode.textContent = "已完成病例 " + progress.completedItems + " / " + progress.totalItems
          + (progress.scope ? " · " + scopeLabel : "")
          + (progress.concurrency ? " · 并发 " + progress.concurrency + " 路" : "")
          + " · 外部调用 " + progress.completedCalls;
        if (output) output.textContent = progress.output || "等待模型返回增量内容…";
      }

      function applyLiveProgressEvent(eventType, data) {
        const progress = state.liveRun.progress;
        if (eventType === "run_started") {
          progress.phase = "已建立流式连接";
          progress.totalCalls = Number(data.total_calls || 0);
          progress.totalItems = Number(data.total_items || 0);
          progress.completedCalls = 0;
          progress.completedItems = 0;
          progress.concurrency = Number(data.concurrency || 1);
          progress.output = "";
        } else if (eventType === "call_started") {
          progress.phase = data.scope === "judge" ? "正在进行结构化 Judge" : "正在生成模型回答";
          progress.scope = String(data.scope || "");
          progress.role = String(data.role || "");
          progress.caseId = String(data.case_id || "");
          progress.turn = Number(data.turn || 0);
          progress.completedCalls = Number(data.completed_calls || progress.completedCalls);
          progress.totalCalls = Number(data.total_calls || progress.totalCalls);
          progress.output = "";
        } else if (eventType === "token") {
          progress.output = (progress.output + String(data.text || "")).slice(-12000);
        } else if (eventType === "call_completed") {
          progress.completedCalls = Number(data.completed_calls || progress.completedCalls);
          progress.totalCalls = Number(data.total_calls || progress.totalCalls);
        } else if (eventType === "item_started") {
          progress.phase = "正在生成模型回答";
          progress.role = String(data.role || progress.role);
          progress.caseId = String(data.case_id || progress.caseId);
          progress.completedItems = Number(data.completed_items || progress.completedItems);
          progress.totalItems = Number(data.total_items || progress.totalItems);
          progress.completedCalls = Number(data.completed_calls || progress.completedCalls);
          progress.totalCalls = Number(data.total_calls || progress.totalCalls);
        } else if (eventType === "item_completed") {
          progress.phase = "已完成一组版本病例";
          progress.role = String(data.role || progress.role);
          progress.caseId = String(data.case_id || progress.caseId);
          progress.completedCalls = Number(data.completed_calls || progress.completedCalls);
          progress.totalCalls = Number(data.total_calls || progress.totalCalls);
          progress.completedItems = Number(data.completed_items || progress.completedItems);
          progress.totalItems = Number(data.total_items || progress.totalItems);
        }
        updateLiveProgressView();
      }

      function setLiveRunError(code, message, requiresNewAttempt = false) {
        state.liveRun.phase = "error";
        state.liveRun.result = null;
        state.liveRun.requiresNewAttempt = requiresNewAttempt;
        state.liveRun.error = { code: String(code || "LIVE_RUN_FAILED"), message: String(message || "本次真实评测未完成") };
        state.modal = "run";
        renderModal();
      }

      async function parseLiveRunHttpError(response) {
        let rawText = "";
        try { rawText = await response.text(); } catch (error) { /* use HTTP fallback below */ }
        let payload = null;
        if (rawText) {
          try { payload = JSON.parse(rawText); } catch (error) { /* non-JSON error body */ }
        }
        const detail = payload && payload.detail;
        if (detail && typeof detail === "object" && !Array.isArray(detail)) {
          return {
            code: String(detail.code || "HTTP_" + response.status),
            message: String(detail.message || "本机评测服务返回 HTTP " + response.status)
          };
        }
        if (Array.isArray(detail)) {
          const issues = detail.slice(0, 3).map((item) => {
            const location = Array.isArray(item && item.loc)
              ? item.loc.filter((part) => part !== "body").map(String).join(".")
              : "";
            const message = item && item.msg ? String(item.msg) : "字段值无效";
            return location ? location + "：" + message : message;
          });
          return {
            code: "REQUEST_VALIDATION_ERROR",
            message: "请求参数校验失败：" + (issues.join("；") || "请求字段无效")
          };
        }
        const safeRawMessage = rawText && !rawText.trim().startsWith("<")
          ? rawText.trim().slice(0, 500)
          : "";
        return {
          code: "HTTP_" + response.status,
          message: safeRawMessage || "本机评测服务返回 HTTP " + response.status + "，请查看启动窗口中的日志"
        };
      }

      async function submitLiveRun() {
        if (!localRuntime) { showToast("真实评测只允许在本机服务中提交"); return; }
        if (state.liveRun.phase === "submitting") return;
        const baselinePrompt = state.liveRun.baselinePrompt;
        const candidatePrompt = state.liveRun.candidatePrompt;
        if (!baselinePrompt.trim() || !candidatePrompt.trim()) {
          setLiveRunError("PROMPT_REQUIRED", "请完整填写 Baseline 与 Candidate 两版提示词");
          return;
        }
        if (!state.testset.selectedCaseIds.length) {
          setLiveRunError("TESTSET_EMPTY", "至少选择 1 个病例后再运行");
          return;
        }
        if (!state.settings.apiKey) {
          setLiveRunError("API_KEY_MISSING", "请先点击左下角“设置”，填写并保存 DeepSeek API Key");
          return;
        }
        if (state.liveRun.phase === "error" && state.liveRun.requiresNewAttempt) {
          const confirmed = typeof window.confirm === "function"
            ? window.confirm("上一次真实运行未完整完成。新建运行可能再次产生模型调用，确认继续吗？")
            : false;
          if (!confirmed) return;
          state.liveRun.idempotencyKey = null;
          state.liveRun.requestFingerprint = null;
          state.liveRun.requiresNewAttempt = false;
        }

        state.liveRun.phase = "submitting";
        state.liveRun.error = null;
        state.liveRun.result = null;
        state.liveRun.progress = {
          phase: "正在建立流式连接",
          scope: "",
          role: "",
          caseId: "",
          turn: 0,
          completedCalls: 0,
          totalCalls: 0,
          completedItems: 0,
          totalItems: 0,
          output: ""
        };
        renderModal();
        const idempotencyKey = makeIdempotencyKey(baselinePrompt, candidatePrompt);
        const headers = { "Content-Type": "application/json", "Idempotency-Key": idempotencyKey };
        if (state.settings.apiKey) headers[API_KEY_HEADER] = state.settings.apiKey;
        let response;
        try {
          response = await window.fetch(LIVE_RUN_ENDPOINT, {
            method: "POST",
            headers,
            body: JSON.stringify({
              baseline_prompt: baselinePrompt,
              candidate_prompt: candidatePrompt,
              test_set: state.testset.key,
              case_ids: state.testset.selectedCaseIds
            })
          });
        } catch (error) {
          setLiveRunError("NETWORK_ERROR", error && error.message ? error.message : "无法连接本机评测服务");
          return;
        }

        if (!response.ok) {
          const httpError = await parseLiveRunHttpError(response);
          const requiresNewAttempt = ["LIVE_RUN_RETRY_BLOCKED", "IDEMPOTENCY_CONFLICT"].includes(httpError.code);
          setLiveRunError(httpError.code, httpError.message, requiresNewAttempt);
          return;
        }
        let completedPayload = null;
        try {
          await consumeLiveRunStream(response, async (eventType, data) => {
            if (eventType === "completed") {
              completedPayload = data;
              return;
            }
            if (eventType === "error") {
              const streamError = new Error(data.message || "本次真实评测未完成");
              streamError.code = data.code || "LIVE_RUN_FAILED";
              streamError.requiresNewAttempt = data.requires_new_attempt !== false;
              throw streamError;
            }
            applyLiveProgressEvent(eventType, data || {});
          });
        } catch (error) {
          setLiveRunError(error.code || "STREAM_ERROR", error.message || "流式评测中断，请新建一次运行", error.requiresNewAttempt !== false);
          return;
        }
        if (!completedPayload) {
          setLiveRunError("STREAM_INCOMPLETE", "流式连接已结束但没有收到最终报告", true);
          return;
        }
        let result;
        try { result = normalizeLiveRun(completedPayload); } catch (error) {
          setLiveRunError("INVALID_RESPONSE", error.message);
          return;
        }
        try {
          state.activeRun = result;
          state.liveRun.phase = "completed";
          state.liveRun.error = null;
          state.liveRun.result = result;
          state.liveRun.requiresNewAttempt = false;
          state.reviewRecord = null;
          buildFromLiveResult(result);
        } catch (error) {
          setLiveRunError("INVALID_RESULT", error.message);
          return;
        }
        closeModal();
        if (result.scenario_scores || result.results) {
          go("multidim");
          showToast("真实评测已完成（" + (result.testset_key || result.provenance?.testset_key || state.testset.key) + "）· Gate=" + result.gate);
        } else {
          go("gate");
          showToast("真实评测已完成：" + result.gate);
        }
      }

      function renderModal() {
        const root = document.getElementById("modal-root");
        if (state.modal === "settings") {
          const hasKey = Boolean(state.settings.apiKey);
          root.innerHTML = "<div class='modal-backdrop' data-action='close-modal'><section class='modal' role='dialog' aria-modal='true' aria-labelledby='settings-modal-title' data-modal='content'><div class='modal-head'><div><h2 id='settings-modal-title'>设置</h2><p>配置本机模型调用参数</p></div><button class='icon-button' data-action='close-modal' aria-label='关闭'>×</button></div><div class='modal-body'><div class='settings-key-status'>Key 只通过当前页面请求发送到本机服务，不写入文件或浏览器存储。关闭页面后需要重新配置。</div><div class='field'><label for='settings-api-key'>DeepSeek API Key</label><input id='settings-api-key' type='password' autocomplete='off' spellcheck='false' value='" + escapeHtml(state.settingsDraftKey) + "' placeholder='粘贴本机使用的 API Key' /></div><div class='status-list' style='margin-top:0'><div class='status-line'><span>当前状态</span><strong>" + (hasKey ? "已配置（当前页面）" : "未配置") + "</strong></div></div></div><div class='modal-foot'><button class='btn' data-action='close-modal'>取消</button><button class='btn primary' data-action='save-settings'>保存设置</button></div></section></div>";
        } else if (state.modal === "testset") {
          const selected = new Set(state.testsetDraftIds);
          root.innerHTML = "<div class='modal-backdrop' data-action='close-modal'><section class='modal testset-modal' role='dialog' aria-modal='true' aria-labelledby='testset-modal-title' data-modal='content'><div class='modal-head'><div><h2 id='testset-modal-title'>调整测评集</h2><p>" + escapeHtml(testsetTitle) + " · 选择本次运行使用的病例</p></div><button class='icon-button' data-action='close-modal' aria-label='关闭'>×</button></div><div class='modal-body'><div class='testset-toolbar'><strong id='testset-selected-count'>" + selected.size + " / " + testsetEntries.length + " 已选择</strong><div class='testset-toolbar-actions'><button class='btn ghost small' data-action='select-all-testset'>全选</button><button class='btn ghost small' data-action='clear-testset'>清空</button></div></div><div class='testset-case-list'>" + testsetEntries.map((entry) => "<label class='testset-case'><input type='checkbox' data-testset-case='" + escapeHtml(entry.case_id) + "' " + (selected.has(entry.case_id) ? "checked" : "") + " /><span class='testset-case-copy'><strong>" + escapeHtml(entry.case_id) + " · " + escapeHtml(entry.title) + "</strong><span>" + escapeHtml(entry.priority) + " · " + escapeHtml(entry.checkpoint) + "</span></span></label>").join("") + "</div></div><div class='modal-foot'><button class='btn' data-action='close-modal'>取消</button><button class='btn primary' data-action='save-testset'>应用选择</button></div></section></div>";
        } else if (state.modal === "run") {
          const submitting = state.liveRun.phase === "submitting";
          const progress = state.liveRun.progress;
          const statusMessage = submitting ? "<div class='run-progress' id='run-progress' role='status' aria-live='polite'><strong id='run-progress-label'>" + escapeHtml(progress.phase) + "</strong><span id='run-progress-detail'>正在调用 " + LIVE_MODEL + "，等待首个增量事件…</span><pre id='run-stream-output' class='run-stream-output'>" + escapeHtml(progress.output || "等待模型返回增量内容…") + "</pre></div>" : "";
          const errorMessage = state.liveRun.error ? "<div class='run-error' id='run-error' role='alert'><strong>" + escapeHtml(state.liveRun.error.code) + "</strong><span>" + escapeHtml(state.liveRun.error.message) + "</span></div>" : "";
          const hasKey = Boolean(state.settings.apiKey);
          const submitAction = hasKey ? "submit-live-run" : "open-settings";
          const submitLabel = submitting ? "评测运行中…" : !hasKey ? "先配置 Key" : state.liveRun.requiresNewAttempt ? "确认新建一次评测" : state.liveRun.phase === "error" ? "重试或查询原运行" : "运行真实评测";
          root.innerHTML = "<div class='modal-backdrop' data-action='close-modal'><section class='modal live-run-modal' role='dialog' aria-modal='true' aria-labelledby='run-modal-title' data-modal='content'><div class='modal-head'><div><h2 id='run-modal-title'>运行真实评测</h2><p>本机服务 · 模型 " + LIVE_MODEL + " · 测评集 " + escapeHtml(state.testset.key) + "</p></div><button class='icon-button' data-action='close-modal' aria-label='关闭' " + (submitting ? "disabled" : "") + ">×</button></div><div class='modal-body'><div class='mode-callout'><span>ⓘ</span><span>请勿输入真实患者信息或其他敏感内容。" + hint("本次运行会使用当前选中的 " + state.testset.selectedCaseIds.length + " 个病例，并返回真实 Gate 与证据。") + "</span></div>" + statusMessage + errorMessage + "<div class='prompt-grid'><div class='field'><label for='run-baseline-prompt'>Baseline 提示词 <span style='color:var(--red)'>*</span></label><textarea id='run-baseline-prompt' data-run-prompt='baseline' maxlength='12000' placeholder='输入当前线上版或基线版系统提示词' " + (submitting ? "disabled" : "") + ">" + escapeHtml(state.liveRun.baselinePrompt) + "</textarea></div><div class='field'><label for='run-candidate-prompt'>Candidate 提示词 <span style='color:var(--red)'>*</span></label><textarea id='run-candidate-prompt' data-run-prompt='candidate' maxlength='12000' placeholder='输入准备发布的候选版系统提示词' " + (submitting ? "disabled" : "") + ">" + escapeHtml(state.liveRun.candidatePrompt) + "</textarea></div></div><div class='summary-strip' style='margin:0'><span class='summary-pill'>模型 <strong>" + LIVE_MODEL + "</strong></span><span class='summary-pill'>病例 <strong>" + state.testset.selectedCaseIds.length + "</strong></span><span class='summary-pill'>Key <strong>" + (hasKey ? "已配置" : "未配置") + "</strong></span><span class='summary-pill'>模式 <strong>真实调用</strong></span></div></div><div class='modal-foot'><button class='btn' data-action='close-modal' " + (submitting ? "disabled" : "") + ">取消</button><button class='btn primary' data-action='" + submitAction + "' " + (submitting ? "disabled" : "") + ">" + submitLabel + "</button></div></section></div>";
        } else if (state.modal === "review") {
          const item = keyCase();
          root.innerHTML = "<div class='modal-backdrop' data-action='close-modal'><section class='modal' role='dialog' aria-modal='true' aria-labelledby='review-modal-title' data-modal='content'><div class='modal-head'><div><h2 id='review-modal-title'>记录复核</h2><p>" + escapeHtml(item ? item.id + " · " + (detail[item.id] || {}).finding : "当前运行") + "</p></div><button class='icon-button' data-action='close-modal' aria-label='关闭'>×</button></div><div class='modal-body'><div class='mode-callout'><span>ⓘ</span><span>这条记录只保存在当前页面，不会改写服务端原始运行结果。</span></div><div class='field'><label>复核结论 <span style='color:var(--red)'>*</span></label><div class='radio-grid'><label class='radio-card'><input type='radio' name='review-decision' value='confirmed' checked /><span><strong>确认问题</strong><span>保留当前证据，等待服务端重算</span></span></label><label class='radio-card'><input type='radio' name='review-decision' value='false_positive' /><span><strong>误报</strong><span>记录本页判断，不改写原始结果</span></span></label></div></div><div class='field'><label for='review-reason'>复核说明 <span style='color:var(--red)'>*</span></label><textarea id='review-reason' placeholder='至少 5 个字，说明你的证据判断'></textarea></div></div><div class='modal-foot'><button class='btn' data-action='close-modal'>取消</button><button class='btn primary' data-action='submit-review'>记录复核</button></div></section></div>";
        }
      }

      function closeModal() {
        state.modal = null;
        document.getElementById("modal-root").innerHTML = "";
      }

      function go(route) {
        state.route = route;
        closeModal();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.addEventListener("click", async (event) => {
        const routeButton = event.target.closest("[data-route]");
        if (routeButton) { go(routeButton.dataset.route); return; }
        const action = event.target.closest("[data-action]");
        if (!action) return;
        const name = action.dataset.action;
        if (name === "open-settings") {
          state.settingsDraftKey = state.settings.apiKey;
          state.modal = "settings";
          renderModal();
        } else if (name === "save-settings") {
          state.settings.apiKey = state.settingsDraftKey.trim();
          closeModal();
          showToast(state.settings.apiKey ? "Key 已保存到当前页面" : "已清除当前页面 Key");
        } else if (name === "open-testset-modal") {
          state.testsetDraftIds = state.testset.selectedCaseIds.slice();
          state.modal = "testset";
          renderModal();
        } else if (name === "select-all-testset") {
          state.testsetDraftIds = testsetEntries.map((entry) => entry.case_id);
          renderModal();
        } else if (name === "clear-testset") {
          state.testsetDraftIds = [];
          renderModal();
        } else if (name === "save-testset") {
          const ids = [...new Set(state.testsetDraftIds)].filter((id) => testsetEntries.some((entry) => entry.case_id === id));
          if (!ids.length) { showToast("至少选择 1 个病例"); return; }
          state.testset.selectedCaseIds = ids;
          state.activeRun = null;
          state.reviewRecord = null;
          cases = [];
          detail = {};
          dimensions = [];
          scores = { baseline: 0, candidate: 0 };
          scoreDelta = 0;
          closeModal();
          state.route = "overview";
          render();
          showToast("测评集已调整，等待下一次真实运行");
        } else if (name === "open-run-modal") {
          if (!localRuntime) { showToast("真实评测只在本机服务中开放"); return; }
          if (!state.testset.selectedCaseIds.length) { showToast("请先选择至少 1 个病例"); return; }
          state.modal = "run";
          renderModal();
        } else if (name === "open-save-version") {
          state.prompts.showSaveForm = true;
          render();
        } else if (name === "close-save-version") {
          state.prompts.showSaveForm = false;
          render();
        } else if (name === "save-prompt-version") {
          await savePromptVersion();
        } else if (name === "load-version-badcases") {
          const sha = action.dataset.sha;
          if (sha) loadPromptBadCases(sha);
        } else if (name === "close-version-detail") {
          state.prompts.selectedSha = "";
          state.prompts.badCases = null;
          render();
        } else if (name === "open-review-modal") {
          state.modal = "review";
          renderModal();
        } else if (name === "close-modal") {
          if (state.liveRun.phase === "submitting") return;
          if (!event.target.closest("[data-modal='content']") || event.target.closest(".icon-button") || event.target.closest(".modal-foot .btn")) closeModal();
        } else if (name === "submit-live-run") {
          await submitLiveRun();
        } else if (name === "submit-review") {
          const decision = document.querySelector("input[name='review-decision']:checked")?.value || "confirmed";
          const reason = (document.getElementById("review-reason")?.value || "").replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
          if (reason.length < 5 || reason.length > 1000) { showToast("复核说明需为 5–1,000 个有效字符"); return; }
          state.reviewRecord = { decision, reason };
          closeModal();
          render();
          showToast("复核已记录到当前页面；服务端 Gate 尚未改变");
        } else if (name === "view-case" || name === "select-case") {
          state.selectedCase = action.dataset.caseKey || state.selectedCase;
          go("case");
        } else if (name === "clear-filters") {
          state.search = "";
          state.severity = "all";
          state.dimension = "all";
          state.review = "all";
          updateEvaluationTable();
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.dataset.filter === "search") {
          state.search = event.target.value;
          updateEvaluationTable();
        }
        if (event.target.dataset.runPrompt === "baseline") {
          state.liveRun.baselinePrompt = event.target.value;
          if (state.liveRun.phase === "error") { state.liveRun.phase = "idle"; state.liveRun.error = null; }
        }
        if (event.target.dataset.runPrompt === "candidate") {
          state.liveRun.candidatePrompt = event.target.value;
          if (state.liveRun.phase === "error") { state.liveRun.phase = "idle"; state.liveRun.error = null; }
        }
        if (event.target.id === "settings-api-key") state.settingsDraftKey = event.target.value;
      });

      document.addEventListener("change", (event) => {
        if (event.target.dataset.action === "switch-testset") {
          const newKey = event.target.value;
          switchLiveTestset(newKey);
          return;
        }
        if (event.target.dataset.filter === "severity") { state.severity = event.target.value; updateEvaluationTable(); }
        if (event.target.dataset.filter === "dimension") { state.dimension = event.target.value; updateEvaluationTable(); }
        if (event.target.dataset.filter === "review") { state.review = event.target.value; updateEvaluationTable(); }
        if (event.target.dataset.testsetCase) {
          const ids = new Set(state.testsetDraftIds);
          if (event.target.checked) ids.add(event.target.dataset.testsetCase);
          else ids.delete(event.target.dataset.testsetCase);
          state.testsetDraftIds = [...ids];
          const count = document.getElementById("testset-selected-count");
          if (count) count.textContent = state.testsetDraftIds.length + " / " + testsetEntries.length + " 已选择";
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.modal && state.liveRun.phase !== "submitting") closeModal();
      });

      function placeHint(hintNode) {
        const body = hintNode.querySelector(".hint-body");
        if (!body) return;
        const anchor = hintNode.getBoundingClientRect();
        const box = body.getBoundingClientRect();
        const left = Math.max(8, Math.min(anchor.left + anchor.width / 2 - box.width / 2, window.innerWidth - box.width - 8));
        const above = anchor.top - box.height - 8;
        body.style.left = left + "px";
        body.style.top = (above >= 8 ? above : anchor.bottom + 8) + "px";
        hintNode.classList.add("open");
      }

      function closeHints(except = null) {
        document.querySelectorAll(".hint.open").forEach((hintNode) => {
          if (hintNode !== except) hintNode.classList.remove("open");
        });
      }

      document.addEventListener("pointerover", (event) => {
        const hintNode = event.target.closest ? event.target.closest(".hint") : null;
        closeHints(hintNode);
        if (hintNode && !hintNode.classList.contains("open")) placeHint(hintNode);
      });
      document.addEventListener("focusin", (event) => {
        const hintNode = event.target.closest ? event.target.closest(".hint") : null;
        closeHints(hintNode);
        if (hintNode) placeHint(hintNode);
      });
      document.addEventListener("scroll", () => closeHints(), true);
      window.addEventListener("resize", () => closeHints());

      async function boot() {
        const app = document.getElementById("app");
        app.innerHTML = "<div class='page'><div class='empty'>正在加载测评集…</div></div>";
        try {
          await loadAssets();
        } catch (error) {
          app.innerHTML = "<div class='page'><div class='empty'>无法加载测评集：" + escapeHtml(error.message) + "<br />请通过 <span class='mono'>启动MedGate.command</span> 打开本页。</div></div>";
          return;
        }
        render();
      }

      const ready = boot();
    </script>
  </body>
</html>
